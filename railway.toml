[build]
builder = "RAILPACK"
buildCommand = "npm run build"
watchPatterns = [
  "src/**",
  "viewer/**",
  "scripts/**",
  ".node-version",
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "railway.toml",
]

[deploy]
preDeployCommand = ["npm run predeploy:production"]
startCommand = "node dist/src/server.js"
# Railway uses this only while activating a deployment. Keep that decision on
# local startup dependencies; the protected deployment attestor and continuous
# monitors still exercise the deeper /ready provider-readiness route.
healthcheckPath = "/startup"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
