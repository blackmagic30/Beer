version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    groups:
      npm-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Production and the locked sensitive-worker boundary remain reviewed
      # against Node 22; do not propose incompatible Node type majors until the
      # runtime contract is intentionally upgraded with them.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/apps/android"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Australia/Melbourne
    groups:
      android-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    groups:
      github-actions-runtime:
        patterns:
          - "*"
    open-pull-requests-limit: 3
