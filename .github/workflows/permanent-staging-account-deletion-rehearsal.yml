name: Rehearse Pint Path permanent-staging account deletion
run-name: Account deletion rehearsal | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main and deployed in permanent staging
        required: true
        type: string
      confirmation:
        description: RUN_ACCOUNT_DELETION_REHEARSAL_IN_PERMANENT_STAGING
        required: true
        type: string
      external_mutation_freeze_attestation:
        description: I_ATTEST_EXTERNAL_RAILWAY_MUTATIONS_ARE_FROZEN_FOR_THIS_RUN
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-permanent-staging-key-rollout
  queue: max
  cancel-in-progress: false

jobs:
  verify-prerequisites:
    name: Verify, bind, and arm unconditional cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the exact current main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Require the exact original dispatch
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FREEZE: ${{ inputs.external_mutation_freeze_attestation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$CONFIRMATION" = RUN_ACCOUNT_DELETION_REHEARSAL_IN_PERMANENT_STAGING
          test "$FREEZE" = I_ATTEST_EXTERNAL_RAILWAY_MUTATIONS_ARE_FROZEN_FOR_THIS_RUN
          test '${{ github.ref }}' = refs/heads/main
          test '${{ github.run_attempt }}' = 1
          test '${{ github.sha }}' = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Verify the rehearsal contract before arming cleanup
        run: npm run account-deletion:rehearsal:contract:check
      - name: Create reviewed authority and a durable cleanup arm
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pintpath-account-deletion-authority"
          install -d -m 700 "$evidence"
          npm run --silent github:account-deletion-rehearsal-authority:verify -- \
            --mode start --candidate-sha "$CANDIDATE_SHA" \
            --evidence-dir "$evidence"
          jq -n --arg candidateSha "$CANDIDATE_SHA" \
            --arg activationRunId '${{ github.run_id }}' '{
              schemaVersion:"pintpath-account-deletion-rehearsal-cleanup-arm/v1",
              candidateSha:$candidateSha,
              activationRunId:$activationRunId,
              projectId:"48d8c6cd-1c66-4148-874b-20877f48e1a5",
              environmentId:"a4e0f507-d6d3-4df9-a818-ad92c0071a35",
              serviceId:"6816c4a2-e392-4ee5-826f-2584cb599ec0",
              cleanupRequired:true,
              disarmCondition:"SAFE_ONE_PREACTIVATION_OR_SAFE_ONE_FINAL_OR_QUARANTINED_ZERO",
              secretMaterialIncluded:false
            }' > "$evidence/cleanup-arm.json"
          chmod 600 "$evidence/cleanup-arm.json"
      - name: Retain the authority and cleanup arm before any mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-arm-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-account-deletion-authority/
          if-no-files-found: error
          retention-days: 90

  scale-safe-to-two:
    name: Scale the safe candidate from one to two
    needs: verify-prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: permanent-staging-scale-evidence
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.candidate_sha }}" }
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - name: Install the exact reviewed Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pintpath-railway-cli"; install -d -m 700 "$root"
          archive="$root/railway.tar.gz"
          curl --fail --silent --show-error --location 'https://github.com/railwayapp/cli/releases/download/v5.32.0/railway-v5.32.0-x86_64-unknown-linux-musl.tar.gz' --output "$archive"
          echo 'cd69b2ecb556601751165d85ac31a5fbc38cff46397939356df28d2b96a005f5  '"$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root" --no-same-owner --no-same-permissions
          echo '27133cfc20bffc43b2f32c1638fa3c50eefc2f9d2d80301a93de34632ccb7a43  '"$root/railway" | sha256sum --check --strict
          chmod 500 "$root/railway"; echo "PINTPATH_RAILWAY_CLI_PATH=$root/railway" >> "$GITHUB_ENV"
      - name: Download the pre-mutation authority and cleanup arm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pintpath-account-deletion-rehearsal-arm-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/authority
      - name: Prepare and seal the single scale-out attempt before exposing scale authority
        id: attempt
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod -R go-rwx "$RUNNER_TEMP/authority"
          attempt="$RUNNER_TEMP/pintpath-account-deletion-attempt-prepare-two"
          install -d -m 700 "$attempt"
          npm run --silent account-deletion:rehearsal:action:prepare -- \
            --operation prepare-two --candidate-sha '${{ inputs.candidate_sha }}' \
            --activation-run-id '${{ github.run_id }}' \
            --authority-file "$RUNNER_TEMP/authority/github-authority.json" \
            --prerequisite-file "$RUNNER_TEMP/authority/cleanup-arm.json" \
            --evidence-dir "$attempt" > "$attempt/result.json"
          sha="$(sha256sum "$attempt/attempt-arm.json" | cut -d' ' -f1)"
          test "$(jq -r .contentSha256 "$attempt/result.json")" = "$sha"
          echo "content_sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Retain the scale-out attempt arm before exposing scale authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-attempt-prepare-two-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-account-deletion-attempt-prepare-two/
          if-no-files-found: error
          retention-days: 90
      - name: Scale safe permanent staging to two once
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_CONFIRMATION: PREPARE_ACCOUNT_DELETION_REHEARSAL_TWO_REPLICAS_IN_PERMANENT_STAGING
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_SCALE_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_SCALE_TOKEN }}
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_ATTEMPT_ARM_FILE: ${{ runner.temp }}/pintpath-account-deletion-attempt-prepare-two/attempt-arm.json
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_ATTEMPT_ARM_SHA256: ${{ steps.attempt.outputs.content_sha256 }}
        shell: bash
        run: |
          chmod -R go-rwx "$RUNNER_TEMP/authority"
          install -d -m 700 "$RUNNER_TEMP/pintpath-account-deletion-scale-out"
          npm run --silent railway:staging:account-deletion:scale:protected -- \
            --operation prepare-two --candidate-sha '${{ inputs.candidate_sha }}' \
            --activation-run-id '${{ github.run_id }}' \
            --authority-file "$RUNNER_TEMP/authority/github-authority.json" \
            --prerequisite-file "$RUNNER_TEMP/authority/cleanup-arm.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-account-deletion-scale-out"
      - name: Upload scale-out evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-scale-out-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-account-deletion-scale-out/
          if-no-files-found: error
          retention-days: 90

  store-activation:
    name: Store exact rehearsal activation without deploying
    needs: [verify-prerequisites, scale-safe-to-two]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: permanent-staging-provider-mutation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.candidate_sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - name: Download armed authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pintpath-account-deletion-rehearsal-arm-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-account-deletion-authority
      - name: Prepare and seal the activation write before exposing variable authority
        id: attempt
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod -R go-rwx "$RUNNER_TEMP/pintpath-account-deletion-authority"
          attempt="$RUNNER_TEMP/pintpath-account-deletion-attempt-store-activation"
          install -d -m 700 "$attempt"
          npm run --silent account-deletion:rehearsal:action:prepare -- \
            --operation store-activation --candidate-sha '${{ inputs.candidate_sha }}' \
            --activation-run-id '${{ github.run_id }}' \
            --authority-file "$RUNNER_TEMP/pintpath-account-deletion-authority/github-authority.json" \
            --evidence-dir "$attempt" > "$attempt/result.json"
          sha="$(sha256sum "$attempt/attempt-arm.json" | cut -d' ' -f1)"
          test "$(jq -r .contentSha256 "$attempt/result.json")" = "$sha"
          echo "content_sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Retain the activation attempt arm before exposing variable authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-attempt-store-activation-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-account-deletion-attempt-store-activation/
          if-no-files-found: error
          retention-days: 90
      - name: Atomically store exact activation variables with skipDeploys true
        env:
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_CONFIRMATION: ACTIVATE_ACCOUNT_DELETION_REHEARSAL_IN_PERMANENT_STAGING
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_VARIABLE_MUTATION_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_VARIABLE_MUTATION_TOKEN }}
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_ATTEMPT_ARM_FILE: ${{ runner.temp }}/pintpath-account-deletion-attempt-store-activation/attempt-arm.json
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_ATTEMPT_ARM_SHA256: ${{ steps.attempt.outputs.content_sha256 }}
        shell: bash
        run: |
          chmod -R go-rwx "$RUNNER_TEMP/pintpath-account-deletion-authority"
          install -d -m 700 "$RUNNER_TEMP/pintpath-account-deletion-activation"
          npm run --silent railway:staging:account-deletion:transition:protected -- \
            --operation store-activation --candidate-sha '${{ inputs.candidate_sha }}' \
            --activation-run-id '${{ github.run_id }}' \
            --authority-file "$RUNNER_TEMP/pintpath-account-deletion-authority/github-authority.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-account-deletion-activation"
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-activation-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-account-deletion-activation/
          if-no-files-found: error
          retention-days: 90

  apply-active-config:
    name: Redeploy the same source and prove both active replicas
    needs: [verify-prerequisites, store-activation]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: permanent-staging-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.candidate_sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - name: Install exact Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pintpath-railway-cli"; install -d -m 700 "$root"; archive="$root/railway.tar.gz"
          curl --fail --silent --show-error --location 'https://github.com/railwayapp/cli/releases/download/v5.32.0/railway-v5.32.0-x86_64-unknown-linux-musl.tar.gz' --output "$archive"
          echo 'cd69b2ecb556601751165d85ac31a5fbc38cff46397939356df28d2b96a005f5  '"$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root" --no-same-owner --no-same-permissions
          echo '27133cfc20bffc43b2f32c1638fa3c50eefc2f9d2d80301a93de34632ccb7a43  '"$root/railway" | sha256sum --check --strict
          chmod 500 "$root/railway"; echo "PINTPATH_RAILWAY_CLI_PATH=$root/railway" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "pintpath-account-deletion-rehearsal-arm-${{ inputs.candidate_sha }}-${{ github.run_id }}", path: "${{ runner.temp }}/pintpath-account-deletion-authority" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "pintpath-account-deletion-rehearsal-activation-${{ inputs.candidate_sha }}", path: "${{ runner.temp }}/pintpath-account-deletion-activation" }
      - name: Prepare and seal the active redeploy before exposing deployment authority
        id: attempt
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod -R go-rwx "$RUNNER_TEMP/pintpath-account-deletion-authority" "$RUNNER_TEMP/pintpath-account-deletion-activation"
          attempt="$RUNNER_TEMP/pintpath-account-deletion-attempt-apply-active"
          install -d -m 700 "$attempt"
          npm run --silent account-deletion:rehearsal:action:prepare -- \
            --operation apply-active --candidate-sha '${{ inputs.candidate_sha }}' \
            --activation-run-id '${{ github.run_id }}' \
            --authority-file "$RUNNER_TEMP/pintpath-account-deletion-authority/github-authority.json" \
            --prerequisite-file "$RUNNER_TEMP/pintpath-account-deletion-activation/terminal.json" \
            --evidence-dir "$attempt" > "$attempt/result.json"
          sha="$(sha256sum "$attempt/attempt-arm.json" | cut -d' ' -f1)"
          test "$(jq -r .contentSha256 "$attempt/result.json")" = "$sha"
          echo "content_sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Retain the active-redeploy attempt arm before exposing deployment authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-attempt-apply-active-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-account-deletion-attempt-apply-active/
          if-no-files-found: error
          retention-days: 90
      - name: Redeploy existing deployment without source upload and prove readiness on both instances
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_DEPLOY_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_DEPLOY_TOKEN }}
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_ATTEMPT_ARM_FILE: ${{ runner.temp }}/pintpath-account-deletion-attempt-apply-active/attempt-arm.json
          PINTPATH_ACCOUNT_DELETION_REHEARSAL_ATTEMPT_ARM_SHA256: ${{ steps.attempt.outputs.content_sha256 }}
        shell: bash
        run: |
          chmod -R go-rwx "$RUNNER_TEMP/pintpath-account-deletion-authority" "$RUNNER_TEMP/pintpath-account-deletion-activation"
          install -d -m 700 "$RUNNER_TEMP/pintpath-account-deletion-active-redeploy"
          npm run --silent railway:staging:account-deletion:redeploy:protected -- \
            --operation apply-active --candidate-sha '${{ inputs.candidate_sha }}' \
            --transition-run-id '${{ github.run_id }}' \
            --transition-terminal-file "$RUNNER_TEMP/pintpath-account-deletion-activation/terminal.json" \
            --authority-file "$RUNNER_TEMP/pintpath-account-deletion-authority/github-authority.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-account-deletion-active-redeploy"
      - name: Upload active redeploy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-active-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-account-deletion-active-redeploy/
          if-no-files-found: error
          retention-days: 90

  prove:
    name: Prove active deletion rehearsal receipt
    needs: apply-active-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "pintpath-account-deletion-rehearsal-active-${{ inputs.candidate_sha }}", path: "${{ runner.temp }}/active" }
      - name: Require exact active profile on two distinct replicas
        shell: bash
        run: |
          jq -e --arg sha '${{ inputs.candidate_sha }}' '
            .receipt.schemaVersion == "pintpath-account-deletion-rehearsal-redeploy/v1" and
            .receipt.outcome == "redeployed_active" and
            .receipt.candidateSha == $sha and
            .receipt.runtime.exact == true and
            (.receipt.runtime.replicaIdSha256s | length) == 2 and
            (.receipt.runtime.providerReadinessSha256s | length) == 2 and
            .receipt.checks.sourceUnchanged == true and
            .receipt.checks.accountDeletionRuntimeStateExact == true
          ' "$RUNNER_TEMP/active/terminal.json" >/dev/null

  store-cleanup:
    name: Unconditionally store exact disabled and absent cleanup
    if: always() && needs.verify-prerequisites.result == 'success'
    needs: [verify-prerequisites, prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: permanent-staging-provider-mutation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.candidate_sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "pintpath-account-deletion-rehearsal-arm-${{ inputs.candidate_sha }}-${{ github.run_id }}", path: "${{ runner.temp }}/authority" }
      - name: Prepare and seal the cleanup write before exposing variable authority
        id: attempt
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod -R go-rwx "$RUNNER_TEMP/authority"
          attempt="$RUNNER_TEMP/pintpath-account-deletion-attempt-store-cleanup"
          install -d -m 700 "$attempt"
          npm run --silent account-deletion:rehearsal:action:prepare -- \
            --operation store-cleanup --candidate-sha '${{ inputs.candidate_sha }}' \
            --activation-run-id '${{ github.run_id }}' \
            --authority-file "$RUNNER_TEMP/authority/github-authority.json" \
            --evidence-dir "$attempt" > "$attempt/result.json"
          sha="$(sha256sum "$attempt/attempt-arm.json" | cut -d' ' -f1)"
          test "$(jq -r .contentSha256 "$attempt/result.json")" = "$sha"
          echo "content_sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Retain the cleanup attempt arm before exposing variable authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-account-deletion-rehearsal-attempt-store-cleanup-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-account-deletion-attempt-store-cleanup/
          if-no-files-found: error
          retention-days: 90
