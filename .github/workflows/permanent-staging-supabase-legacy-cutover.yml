name: Permanent staging Supabase legacy-key cutover
run-name: Permanent staging Supabase legacy cutover | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      replacement_run_id:
        description: Successful same-candidate atomic Supabase key-replacement run
        required: true
        type: string
      deployment_run_id:
        description: Successful same-candidate permanent-staging deployment run after atomic key replacement
        required: true
        type: string
      confirmation:
        description: Type DISABLE_PERMANENT_STAGING_SUPABASE_LEGACY_KEYS
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-permanent-staging-key-rollout
  queue: max
  cancel-in-progress: false

jobs:
  cutover:
    name: Disable exact permanent-staging legacy keys
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: permanent-staging-supabase-legacy-disable
    steps:
      - name: Checkout the exact main candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require an original run at exact current main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REPLACEMENT_RUN_ID: ${{ inputs.replacement_run_id }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPLACEMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$REPLACEMENT_RUN_ID" != "$DEPLOYMENT_RUN_ID"
          test "$DISPATCH_REF" = refs/heads/main
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$RUN_ATTEMPT" = 1
          test "$CONFIRMATION" = DISABLE_PERMANENT_STAGING_SUPABASE_LEGACY_KEYS
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Verify consumers and the complete repository before key custody
        run: |
          npm run supabase:keys:consumer-compatibility:check
          npm run check

      - name: Authenticate the reviewed candidate and fresh cutover dispatch
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          REPLACEMENT_RUN_ID: ${{ inputs.replacement_run_id }}
        run: |
          npm run --silent github:reviewed-candidate-authority:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --operation supabase-legacy-key-cutover \
            --replacement-run-id "$REPLACEMENT_RUN_ID" \
            --deployment-run-id "$DEPLOYMENT_RUN_ID"

      - name: Create the secret-free cutover evidence directory
        shell: bash
        run: mkdir -m 700 "$RUNNER_TEMP/pintpath-supabase-cutover-evidence"

      - name: Require the successful post-replacement staging deployment artifact
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REPLACEMENT_RUN_ID: ${{ inputs.replacement_run_id }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --frozen-intrinsics --disable-proto=throw --import tsx \
            scripts/verify-github-permanent-staging-deployment.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --replacement-run-id "$REPLACEMENT_RUN_ID" \
            --deployment-run-id "$DEPLOYMENT_RUN_ID" \
            --output "$RUNNER_TEMP/pintpath-supabase-cutover-evidence/deployment-github-authority.json"

      - name: Create private key custody and secret-free dispatch evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REPLACEMENT_RUN_ID: ${{ inputs.replacement_run_id }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          MANAGEMENT_READ_TOKEN: ${{ secrets.PINTPATH_SUPABASE_STAGING_SECRETS_READ_TOKEN }}
          MANAGEMENT_WRITE_TOKEN: ${{ secrets.PINTPATH_SUPABASE_STAGING_SECRETS_WRITE_TOKEN }}
          NEW_PUBLISHABLE_KEY: ${{ secrets.PINTPATH_SUPABASE_STAGING_NEW_PUBLISHABLE_KEY }}
          NEW_SECRET_KEY: ${{ secrets.PINTPATH_SUPABASE_STAGING_NEW_SECRET_KEY }}
          OLD_ANON_KEY: ${{ secrets.PINTPATH_SUPABASE_STAGING_OLD_ANON_KEY }}
          OLD_SERVICE_ROLE_KEY: ${{ secrets.PINTPATH_SUPABASE_STAGING_OLD_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MANAGEMENT_READ_TOKEN"
          test -n "$MANAGEMENT_WRITE_TOKEN"
          test -n "$NEW_PUBLISHABLE_KEY"
          test -n "$NEW_SECRET_KEY"
          test -n "$OLD_ANON_KEY"
          test -n "$OLD_SERVICE_ROLE_KEY"
          test "$MANAGEMENT_READ_TOKEN" != "$MANAGEMENT_WRITE_TOKEN"
          mkdir -m 700 "$RUNNER_TEMP/pintpath-supabase-cutover-input"
          test -f "$RUNNER_TEMP/pintpath-supabase-cutover-evidence/deployment-github-authority.json"
          umask 077
          printf '%s' "$MANAGEMENT_READ_TOKEN" > "$RUNNER_TEMP/pintpath-supabase-cutover-input/management-read-token"
          printf '%s' "$MANAGEMENT_WRITE_TOKEN" > "$RUNNER_TEMP/pintpath-supabase-cutover-input/management-write-token"
          printf '%s' "$NEW_PUBLISHABLE_KEY" > "$RUNNER_TEMP/pintpath-supabase-cutover-input/new-publishable-key"
          printf '%s' "$NEW_SECRET_KEY" > "$RUNNER_TEMP/pintpath-supabase-cutover-input/new-secret-key"
          printf '%s' "$OLD_ANON_KEY" > "$RUNNER_TEMP/pintpath-supabase-cutover-input/old-anon-key"
          printf '%s' "$OLD_SERVICE_ROLE_KEY" > "$RUNNER_TEMP/pintpath-supabase-cutover-input/old-service-role-key"
          jq -n --arg candidateSha "$CANDIDATE_SHA" --arg replacementRunId "$REPLACEMENT_RUN_ID" --arg deploymentRunId "$DEPLOYMENT_RUN_ID" \
            '{schemaVersion:"pintpath-protected-supabase-cutover-dispatch/v1",candidateSha:$candidateSha,replacementRunId:$replacementRunId,deploymentRunId:$deploymentRunId,projectRef:"bbfibbadwjxzrcdncavy",secretMaterialIncluded:false,secretDerivedCommitmentsIncluded:false}' \
            > "$RUNNER_TEMP/pintpath-supabase-cutover-evidence/dispatch.json"

      - name: Reassert exact current main immediately before the provider write
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Canary replacement keys, disable legacy keys once, and reconcile
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_SUPABASE_CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-supabase-cutover.ts \
            --candidate-sha "$CANDIDATE_SHA" \
            --management-read-token-file "$RUNNER_TEMP/pintpath-supabase-cutover-input/management-read-token" \
            --management-write-token-file "$RUNNER_TEMP/pintpath-supabase-cutover-input/management-write-token" \
            --new-publishable-key-file "$RUNNER_TEMP/pintpath-supabase-cutover-input/new-publishable-key" \
            --new-secret-key-file "$RUNNER_TEMP/pintpath-supabase-cutover-input/new-secret-key" \
            --old-anon-key-file "$RUNNER_TEMP/pintpath-supabase-cutover-input/old-anon-key" \
            --old-service-role-key-file "$RUNNER_TEMP/pintpath-supabase-cutover-input/old-service-role-key" \
            --evidence-dir "$RUNNER_TEMP/pintpath-supabase-cutover-evidence"

      - name: Remove all key and provider-token custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/pintpath-supabase-cutover-input"
          if test -d "$input_root"; then
            find "$input_root" -type f -exec shred -u -- {} + 2>/dev/null \
              || find "$input_root" -type f -exec rm -f -- {} +
            find "$input_root" -depth -type d -exec rmdir -- {} +
          fi
          test ! -e "$input_root"

      - name: Upload secret-free cutover evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-permanent-staging-supabase-cutover-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-supabase-cutover-evidence/
          if-no-files-found: error
          retention-days: 90
