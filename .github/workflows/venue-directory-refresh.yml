name: Venue Directory Status Refresh

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venue-directory-status-refresh-production
  cancel-in-progress: false

jobs:
  refresh-production-directory-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    outputs:
      directory_schema_ready: ${{ steps.directory_schema.outputs.ready }}
    env:
      PINTPATH_EXPECTED_SUPABASE_PROJECT_REF: jxpubqlmqnnqwadmjgyk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the exact production Supabase target
        id: supabase_transport
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          key_kind="$(npm exec tsx -- scripts/validate-production-supabase-transport.ts --print-key-kind)"
          case "$key_kind" in
            secret|legacy_service_role) ;;
            *) echo "Supabase server key classification failed." >&2; exit 1 ;;
          esac
          printf 'key_kind=%s\n' "$key_kind" >> "$GITHUB_OUTPUT"

      - name: Check whether the directory-status schema is released
        id: directory_schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PINTPATH_SUPABASE_SERVER_KEY_KIND: ${{ steps.supabase_transport.outputs.key_kind }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { appendFileSync } = await import("node:fs");

          if (process.env.SUPABASE_URL !== "https://auth.pintpath.au") {
            throw new Error("Supabase production origin mismatch.");
          }
          const supabaseUrl = new URL(process.env.SUPABASE_URL);
          const query = new URL("/rest/v1/venues", supabaseUrl);
          query.searchParams.set("select", "business_status,last_checked_at,directory_eligible");
          query.searchParams.set("limit", "0");

          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers = { apikey: serviceRoleKey };
          const keyKind = process.env.PINTPATH_SUPABASE_SERVER_KEY_KIND;
          if (!['secret', 'legacy_service_role'].includes(keyKind)) {
            throw new Error("Supabase server key classification is unavailable.");
          }
          if (keyKind === "legacy_service_role") {
            headers.Authorization = `Bearer ${serviceRoleKey}`;
          }

          const response = await fetch(query, { headers, redirect: "error" });
          if (response.ok) {
            appendFileSync(process.env.GITHUB_OUTPUT, "ready=true\n");
          } else {
            const payload = await response.json().catch(() => null);
            if (response.status === 400 && payload?.code === "42703") {
              appendFileSync(process.env.GITHUB_OUTPUT, "ready=false\n");
              console.warn(
                "::warning::Venue directory refresh is deferred until migration " +
                "20260728120312_venue_directory_operational_status is released.",
              );
            } else {
              throw new Error(`Directory schema probe failed with HTTP ${response.status}.`);
            }
          }
          NODE

      - name: Validate a complete status refresh without writes
        if: steps.directory_schema.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: >-
          npm run venues:import --
          --status-only
          --dry-run
          --expected-project-ref="$PINTPATH_EXPECTED_SUPABASE_PROJECT_REF"

      - name: Refresh every existing Place ID
        if: steps.directory_schema.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: >-
          npm run venues:import --
          --status-only
          --expected-project-ref="$PINTPATH_EXPECTED_SUPABASE_PROJECT_REF"

      - name: Enforce five-day warning and pre-expiry failure
        if: always() && steps.directory_schema.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PINTPATH_SUPABASE_SERVER_KEY_KIND: ${{ steps.supabase_transport.outputs.key_kind }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expectedRef = process.env.PINTPATH_EXPECTED_SUPABASE_PROJECT_REF;
          if (
            process.env.SUPABASE_URL !== "https://auth.pintpath.au" ||
            expectedRef !== "jxpubqlmqnnqwadmjgyk"
          ) {
            throw new Error("Supabase production target mismatch.");
          }
          const supabaseUrl = new URL(process.env.SUPABASE_URL);

          const query = new URL("/rest/v1/venues", supabaseUrl);
          query.searchParams.set("select", "last_checked_at");
          query.searchParams.set("directory_eligible", "eq.true");
          query.searchParams.set("order", "last_checked_at.asc");
          query.searchParams.set("limit", "1");
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers = {
            apikey: serviceRoleKey,
          };
          const keyKind = process.env.PINTPATH_SUPABASE_SERVER_KEY_KIND;
          if (!['secret', 'legacy_service_role'].includes(keyKind)) {
            throw new Error("Supabase server key classification is unavailable.");
          }
          if (keyKind === "legacy_service_role") {
            headers.Authorization = `Bearer ${serviceRoleKey}`;
          }
          const response = await fetch(query, {
            headers,
            redirect: "error",
          });
          if (!response.ok) {
            throw new Error(`Directory freshness query failed with HTTP ${response.status}.`);
          }

          const rows = await response.json();
          const checkedAt = Array.isArray(rows) ? Date.parse(rows[0]?.last_checked_at ?? "") : Number.NaN;
          const ageHours = (Date.now() - checkedAt) / 3_600_000;
          if (!Number.isFinite(ageHours) || ageHours < 0) {
            throw new Error("No valid eligible-venue status timestamp is available.");
          }
          if (ageHours >= 138) {
            console.error(`::error::Oldest eligible venue status is ${ageHours.toFixed(1)} hours old; the pre-expiry incident threshold is 138 hours.`);
            process.exit(1);
          }
          if (ageHours >= 120) {
            console.warn(`::warning::Oldest eligible venue status is ${ageHours.toFixed(1)} hours old; investigate before the 138-hour incident threshold.`);
          }
          console.log(`Oldest eligible venue status age: ${ageHours.toFixed(1)} hours.`);
          NODE

  notify-directory-refresh:
    name: Page on failure and emit the deadman heartbeat
    needs: [refresh-production-directory-status]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-24.04
    environment: production-monitoring-alerts
    timeout-minutes: 5
    steps:
      - name: Send the non-secret monitor signal
        shell: bash
        env:
          MONITOR_WEBHOOK_URL: ${{ secrets.PINTPATH_PRODUCTION_MONITOR_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REFRESH_RESULT: ${{ needs.refresh-production-directory-status.result }}
          DIRECTORY_SCHEMA_READY: ${{ needs.refresh-production-directory-status.outputs.directory_schema_ready }}
        run: |
          set -euo pipefail
          set +x

          case "$MONITOR_WEBHOOK_URL" in
            https://*) ;;
            *) echo "Production monitor webhook must use HTTPS." >&2; exit 1 ;;
          esac
          case "$REFRESH_RESULT" in
            success|failure|cancelled|skipped) ;;
            *) echo "Unexpected venue directory refresh job result." >&2; exit 1 ;;
          esac

          monitor="unknown"
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "23 14 * * *" ]]; then
            monitor="daily"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -z "$EVENT_SCHEDULE" ]]; then
            monitor="manual"
          fi

          if [[ "$monitor" == "daily" \
            && "$REFRESH_RESULT" == "success" \
            && "$DIRECTORY_SCHEMA_READY" == "true" ]]; then
            status="success"
            event="pintpath-venue-directory-refresh-heartbeat"
          elif [[ "$monitor" == "manual" \
            && "$REFRESH_RESULT" == "success" \
            && "$DIRECTORY_SCHEMA_READY" == "true" ]]; then
            status="success"
            event="pintpath-venue-directory-refresh-manual-check"
          else
            status="failure"
            event="pintpath-venue-directory-refresh-failed"
          fi

          payload="$(printf '{\"schemaVersion\":1,\"event\":\"%s\",\"status\":\"%s\",\"monitor\":\"%s\",\"trigger\":\"%s\",\"schedule\":\"%s\",\"repository\":\"%s\",\"runId\":\"%s\",\"runAttempt\":\"%s\",\"refreshResult\":\"%s\",\"directorySchemaReady\":\"%s\"}' \
            "$event" "$status" "$monitor" "$EVENT_NAME" "$EVENT_SCHEDULE" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$REFRESH_RESULT" "$DIRECTORY_SCHEMA_READY")"
          http_status="$(curl --request POST \
            --silent --show-error --fail-with-body \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 15 \
            --retry 2 --retry-delay 1 --retry-all-errors \
            -H 'content-type: application/json' \
            --data-binary "$payload" \
            --output /dev/null --write-out '%{http_code}' \
            "$MONITOR_WEBHOOK_URL")"
          case "$http_status" in
            2??) ;;
            *) echo "Production monitor webhook returned a non-2xx response." >&2; exit 1 ;;
          esac
          if [[ "$status" == "failure" ]]; then
            echo "::error::Venue directory refresh failed or remained deferred; the external failure signal was delivered."
            exit 1
          fi
