name: Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-production-health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout read-only health code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check public health and backend readiness
        env:
          PINTPATH_HEALTH_BASE_URL: https://pintpath.au
        run: node scripts/production-health-check.mjs

      - name: Check public discovery correctness
        shell: bash
        run: |
          set -euo pipefail
          venues="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 'https://pintpath.au/api/business/venues?limit=3')"
          missions="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 'https://pintpath.au/api/business/missions?limit=50')"
          node -e '
            const venues = JSON.parse(process.argv[1])?.data?.venues;
            const missions = JSON.parse(process.argv[2])?.data?.missions;
            if (!Array.isArray(venues) || venues.length === 0) throw new Error("No public venues returned");
            if (!Array.isArray(missions)) throw new Error("Mission response missing");
            const demo = missions.filter((row) => String(row?.venueId || "").startsWith("demo:") || String(row?.id || "").includes("demo:"));
            if (demo.length) throw new Error(`Production returned ${demo.length} demo missions`);
          ' "$venues" "$missions"

      - name: Install dependencies
        run: npm ci

      - name: Observe bounded public production data quality
        env:
          PINTPATH_DATA_BASE_URL: https://pintpath.au
        run: |
          set -o pipefail
          npm run --silent readiness:data | tee production-data-readiness.json

  authenticated-user-venue-health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      PINTPATH_SMOKE_BASE_URL: https://pintpath.au
    steps:
      - name: Check authenticated smoke configuration
        id: credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PINTPATH_SMOKE_USER_EMAIL: ${{ secrets.PINTPATH_SMOKE_USER_EMAIL }}
          PINTPATH_SMOKE_USER_PASSWORD: ${{ secrets.PINTPATH_SMOKE_USER_PASSWORD }}
          PINTPATH_SMOKE_VENUE_EMAIL: ${{ secrets.PINTPATH_SMOKE_VENUE_EMAIL }}
          PINTPATH_SMOKE_VENUE_PASSWORD: ${{ secrets.PINTPATH_SMOKE_VENUE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PINTPATH_SMOKE_USER_EMAIL" \
            && -n "$PINTPATH_SMOKE_USER_PASSWORD" \
            && -n "$PINTPATH_SMOKE_VENUE_EMAIL" \
            && -n "$PINTPATH_SMOKE_VENUE_PASSWORD" \
            && -n "$SUPABASE_URL" \
            && -n "$SUPABASE_ANON_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Authenticated user/venue monitoring is not configured. Public production health is checked separately and this is not evidence of a public outage."
          {
            echo "## Authenticated production monitoring is not configured"
            echo
            echo "Create dedicated verified user and venue-manager smoke accounts, then set these protected production environment secrets:"
            echo
            echo "- \`PINTPATH_SMOKE_USER_EMAIL\`"
            echo "- \`PINTPATH_SMOKE_USER_PASSWORD\`"
            echo "- \`PINTPATH_SMOKE_VENUE_EMAIL\`"
            echo "- \`PINTPATH_SMOKE_VENUE_PASSWORD\`"
            echo "- \`SUPABASE_URL\`"
            echo "- \`SUPABASE_ANON_KEY\`"
            echo
            echo "The public health job remains authoritative for public availability."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Authenticated user/venue smoke credentials are required for a manual production-health proof."
            exit 1
          fi

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check authenticated user and venue-manager paths
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PINTPATH_SMOKE_USER_EMAIL: ${{ secrets.PINTPATH_SMOKE_USER_EMAIL }}
          PINTPATH_SMOKE_USER_PASSWORD: ${{ secrets.PINTPATH_SMOKE_USER_PASSWORD }}
          PINTPATH_SMOKE_VENUE_EMAIL: ${{ secrets.PINTPATH_SMOKE_VENUE_EMAIL }}
          PINTPATH_SMOKE_VENUE_PASSWORD: ${{ secrets.PINTPATH_SMOKE_VENUE_PASSWORD }}
        run: npm run --silent smoke:production:auth -- --auth-only --roles=user,venue
