name: Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-production-health:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *') &&
      (github.event_name == 'workflow_dispatch' || vars.PINTPATH_PRODUCTION_MONITORING_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout read-only health code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check public health and backend readiness
        env:
          PINTPATH_HEALTH_BASE_URL: https://pintpath.au
        run: node scripts/production-health-check.mjs

      - name: Check public discovery correctness
        env:
          PINTPATH_DATA_BASE_URL: https://pintpath.au
          PINTPATH_DISCOVERY_LAUNCH_SUBURBS: ${{ vars.PINTPATH_DATA_MARKETED_SUBURBS || 'Brighton' }}
        run: node scripts/production-public-discovery-check.mjs

      - name: Install dependencies
        run: npm ci

      - name: Observe bounded public production data quality
        env:
          PINTPATH_DATA_BASE_URL: https://pintpath.au
          PINTPATH_DATA_MARKETED_SUBURBS: ${{ vars.PINTPATH_DATA_MARKETED_SUBURBS }}
          PINTPATH_DATA_MIN_MARKETED_VENUE_COVERAGE_PERCENT: "70"
          PINTPATH_DATA_MIN_CURRENT_PRICES_PER_VENUE: "3"
          PINTPATH_DATA_MAX_CORE_FRESHNESS_HOURS: "48"
          PINTPATH_DATA_MAX_VENUE_STATUS_AGE_HOURS: "24"
          PINTPATH_DATA_MAX_TRUSTED_ROW_AGE_DAYS: "30"
          PINTPATH_DATA_MIN_HAPPY_HOUR_COVERAGE_PERCENT: "25"
          PINTPATH_DATA_NO_HAPPY_HOUR_LAUNCH_SCOPE: "true"
          PINTPATH_DATA_NO_HAPPY_HOUR_SCOPE_REFERENCE: ${{ vars.PINTPATH_DATA_NO_HAPPY_HOUR_SCOPE_REFERENCE }}
        run: |
          set -o pipefail
          npm run --silent readiness:data | tee production-data-readiness.json

  authenticated-user-venue-health:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *') &&
      (github.event_name == 'workflow_dispatch' || vars.PINTPATH_PRODUCTION_MONITORING_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-monitoring
    env:
      PINTPATH_SMOKE_BASE_URL: https://pintpath.au
    steps:
      - name: Check authenticated smoke configuration
        id: credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PINTPATH_SMOKE_USER_EMAIL: ${{ secrets.PINTPATH_SMOKE_USER_EMAIL }}
          PINTPATH_SMOKE_USER_PASSWORD: ${{ secrets.PINTPATH_SMOKE_USER_PASSWORD }}
          PINTPATH_SMOKE_VENUE_EMAIL: ${{ secrets.PINTPATH_SMOKE_VENUE_EMAIL }}
          PINTPATH_SMOKE_VENUE_PASSWORD: ${{ secrets.PINTPATH_SMOKE_VENUE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PINTPATH_SMOKE_USER_EMAIL" \
            && -n "$PINTPATH_SMOKE_USER_PASSWORD" \
            && -n "$PINTPATH_SMOKE_VENUE_EMAIL" \
            && -n "$PINTPATH_SMOKE_VENUE_PASSWORD" \
            && -n "$SUPABASE_URL" \
            && -n "$SUPABASE_ANON_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::error::Authenticated user/venue monitoring is not configured. The protected production monitor must not report success without end-to-end credentials."
          {
            echo "## Authenticated production monitoring is not configured"
            echo
            echo "Create dedicated verified user and venue-manager smoke accounts, then set these protected production-monitoring environment secrets:"
            echo
            echo "- \`PINTPATH_SMOKE_USER_EMAIL\`"
            echo "- \`PINTPATH_SMOKE_USER_PASSWORD\`"
            echo "- \`PINTPATH_SMOKE_VENUE_EMAIL\`"
            echo "- \`PINTPATH_SMOKE_VENUE_PASSWORD\`"
            echo "- \`SUPABASE_URL\`"
            echo "- \`SUPABASE_ANON_KEY\`"
            echo
            echo "This job fails closed because public probes alone cannot observe authenticated user and venue-manager paths."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Check authenticated user and venue-manager paths
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PINTPATH_SMOKE_USER_EMAIL: ${{ secrets.PINTPATH_SMOKE_USER_EMAIL }}
          PINTPATH_SMOKE_USER_PASSWORD: ${{ secrets.PINTPATH_SMOKE_USER_PASSWORD }}
          PINTPATH_SMOKE_VENUE_EMAIL: ${{ secrets.PINTPATH_SMOKE_VENUE_EMAIL }}
          PINTPATH_SMOKE_VENUE_PASSWORD: ${{ secrets.PINTPATH_SMOKE_VENUE_PASSWORD }}
        run: npm run --silent smoke:production:auth -- --auth-only --roles=user,venue

  notify-production-health:
    name: Page on failure and emit the deadman heartbeat
    needs: [public-production-health, authenticated-user-venue-health]
    if: >-
      ${{ always() &&
      (github.event_name == 'workflow_dispatch' || vars.PINTPATH_PRODUCTION_MONITORING_ENABLED == 'true') }}
    permissions: {}
    runs-on: ubuntu-24.04
    environment: production-monitoring-alerts
    timeout-minutes: 5
    steps:
      - name: Send the non-secret monitor signal
        shell: bash
        env:
          MONITOR_WEBHOOK_URL: ${{ secrets.PINTPATH_PRODUCTION_MONITOR_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          PUBLIC_RESULT: ${{ needs.public-production-health.result }}
          AUTHENTICATED_RESULT: ${{ needs.authenticated-user-venue-health.result }}
        run: |
          set -euo pipefail
          set +x

          case "$MONITOR_WEBHOOK_URL" in
            https://*) ;;
            *) echo "Production monitor webhook must use HTTPS." >&2; exit 1 ;;
          esac
          for result in "$PUBLIC_RESULT" "$AUTHENTICATED_RESULT"; do
            case "$result" in
              success|failure|cancelled|skipped) ;;
              *) echo "Unexpected production health job result." >&2; exit 1 ;;
            esac
          done

          monitor="unknown"
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "*/15 * * * *" ]]; then
            monitor="public"
          elif [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "7 * * * *" ]]; then
            monitor="authenticated"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -z "$EVENT_SCHEDULE" ]]; then
            monitor="manual"
          fi

          if [[ "$monitor" == "public" \
            && "$PUBLIC_RESULT" == "success" \
            && "$AUTHENTICATED_RESULT" == "skipped" ]]; then
            status="success"
            event="pintpath-production-public-health-heartbeat"
          elif [[ "$monitor" == "authenticated" \
            && "$PUBLIC_RESULT" == "skipped" \
            && "$AUTHENTICATED_RESULT" == "success" ]]; then
            status="success"
            event="pintpath-production-authenticated-health-heartbeat"
          elif [[ "$monitor" == "manual" \
            && "$PUBLIC_RESULT" == "success" \
            && "$AUTHENTICATED_RESULT" == "success" ]]; then
            status="success"
            event="pintpath-production-health-manual-check"
          else
            status="failure"
            event="pintpath-production-health-failed"
          fi

          payload="$(printf '{\"schemaVersion\":1,\"event\":\"%s\",\"status\":\"%s\",\"monitor\":\"%s\",\"trigger\":\"%s\",\"schedule\":\"%s\",\"repository\":\"%s\",\"runId\":\"%s\",\"runAttempt\":\"%s\",\"publicResult\":\"%s\",\"authenticatedResult\":\"%s\"}' \
            "$event" "$status" "$monitor" "$EVENT_NAME" "$EVENT_SCHEDULE" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$PUBLIC_RESULT" "$AUTHENTICATED_RESULT")"
          http_status="$(curl --request POST \
            --silent --show-error --fail-with-body \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 5 --max-time 15 \
            --retry 2 --retry-delay 1 --retry-all-errors \
            -H 'content-type: application/json' \
            --data-binary "$payload" \
            --output /dev/null --write-out '%{http_code}' \
            "$MONITOR_WEBHOOK_URL")"
          case "$http_status" in
            2??) ;;
            *) echo "Production monitor webhook returned a non-2xx response." >&2; exit 1 ;;
          esac
          if [[ "$status" == "failure" ]]; then
            echo "::error::Production health failed; the external failure signal was delivered."
            exit 1
          fi
