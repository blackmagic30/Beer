name: Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public health and backend readiness
        shell: bash
        run: |
          set -euo pipefail
          for path in health ready; do
            body="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 30 \
              "https://pintpath.au/${path}")"
            node -e '
              const payload = JSON.parse(process.argv[1]);
              const expected = process.argv[2];
              if (payload?.ok !== true || payload?.data?.status !== expected) {
                throw new Error(`Unexpected ${expected} response: ${process.argv[1]}`);
              }
            ' "$body" "$([ "$path" = "health" ] && printf ok || printf ready)"
          done

      - name: Check public discovery correctness
        shell: bash
        run: |
          set -euo pipefail
          venues="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 'https://pintpath.au/api/business/venues?limit=3')"
          missions="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 'https://pintpath.au/api/business/missions?limit=50')"
          node -e '
            const venues = JSON.parse(process.argv[1])?.data?.venues;
            const missions = JSON.parse(process.argv[2])?.data?.missions;
            if (!Array.isArray(venues) || venues.length === 0) throw new Error("No public venues returned");
            if (!Array.isArray(missions)) throw new Error("Mission response missing");
            const demo = missions.filter((row) => String(row?.venueId || "").startsWith("demo:") || String(row?.id || "").includes("demo:"));
            if (demo.length) throw new Error(`Production returned ${demo.length} demo missions`);
          ' "$venues" "$missions"

      - name: Check authenticated user, venue, and admin paths
        env:
          PINTPATH_SMOKE_USER_TOKEN: ${{ secrets.PINTPATH_SMOKE_USER_TOKEN }}
          PINTPATH_SMOKE_VENUE_TOKEN: ${{ secrets.PINTPATH_SMOKE_VENUE_TOKEN }}
          PINTPATH_SMOKE_ADMIN_TOKEN: ${{ secrets.PINTPATH_SMOKE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PINTPATH_SMOKE_USER_TOKEN:?PINTPATH_SMOKE_USER_TOKEN is required}"
          : "${PINTPATH_SMOKE_VENUE_TOKEN:?PINTPATH_SMOKE_VENUE_TOKEN is required}"
          : "${PINTPATH_SMOKE_ADMIN_TOKEN:?PINTPATH_SMOKE_ADMIN_TOKEN is required}"
          check_data() {
            local path="$1" token="$2" key="$3"
            local body
            body="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 -H "Authorization: Bearer ${token}" "https://pintpath.au${path}")"
            node -e '
              const payload = JSON.parse(process.argv[1]);
              const key = process.argv[2];
              if (payload?.ok !== true || payload?.data?.[key] == null) throw new Error(`Missing authenticated ${key} payload`);
            ' "$body" "$key"
          }
          check_data /api/business/account "$PINTPATH_SMOKE_USER_TOKEN" account
          check_data /api/business/venue-portal "$PINTPATH_SMOKE_VENUE_TOKEN" selectedVenue
          check_data /api/business/admin/operational-health "$PINTPATH_SMOKE_ADMIN_TOKEN" jobs

          queues="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer ${PINTPATH_SMOKE_ADMIN_TOKEN}" \
            'https://pintpath.au/api/business/admin/queues?limit=1&offset=0')"
          node -e '
            const data = JSON.parse(process.argv[1])?.data;
            const arrays = [data?.feedback, data?.wrongPriceReports, data?.venueRequests];
            if (!arrays.every(Array.isArray) || data?.pagination == null || data?.totals == null) {
              throw new Error("Admin review queue response is incomplete");
            }
          ' "$queues"
