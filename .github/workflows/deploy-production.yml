name: Deploy Pint Path protected production
run-name: Deploy production | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main and already healthy in permanent staging
        required: true
        type: string
      fence_run_id:
        description: Exact successful production worker-fence run ID for this candidate
        required: true
        type: string
      confirmation:
        description: DEPLOY_PRODUCTION_<SHA>_AFTER_FENCE_RUN_<ID>
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-production-rollout
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy protected production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-deployment
    env:
      PUBLIC_BASE_URL: https://pintpath.au

    steps:
      - name: Checkout the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require the exact current main candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          FENCE_RUN_ID: ${{ inputs.fence_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$FENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$RUN_ATTEMPT" = "1"
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$CONFIRMATION" = "DEPLOY_PRODUCTION_${CANDIDATE_SHA}_AFTER_FENCE_RUN_${FENCE_RUN_ID}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Require the policy-pinned production public origin
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLIC_BASE_URL" = 'https://pintpath.au'
          policy_origin="$(node --eval \
            'process.stdout.write(require("./ops/railway/production-app-deployment-policy.json").target.publicOrigin)')"
          test "$policy_origin" = "$PUBLIC_BASE_URL"

      - name: Install immutable dependencies
        run: npm ci

      - name: Fetch the authenticated reviewed PR head for release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npm run --silent github:release-reviewed-head:fetch --
          --evidence "$GITHUB_WORKSPACE/docs/release-evidence.json"

      - name: Run the complete repository gate
        run: npm run check

      - name: Create the private deployment evidence directory
        shell: bash
        run: mkdir -m 700 "$RUNNER_TEMP/pintpath-production-deployment-evidence"

      - name: Download the exact production worker-fence artifact
        uses: actions/download-artifact@b7c52a5f7a25fce4c22e476a93420dd79a061a70 # v8.0.1
        with:
          name: pintpath-automatic-maintenance-worker-fence-production-fence-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-production-worker-fence-prerequisite
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fence_run_id }}

      - name: Seal and verify the exact production worker-fence prerequisite
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FENCE_RUN_ID: ${{ inputs.fence_run_id }}
          GITHUB_ACTIONS: "true"
          GITHUB_API_URL: https://api.github.com
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          PINTPATH_PRODUCTION_DEPLOYMENT_FENCE_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_PRODUCTION_DEPLOYMENT_GITHUB_ENVIRONMENT: production-deployment
        shell: bash
        run: |
          set -euo pipefail
          prerequisite_root="$RUNNER_TEMP/pintpath-production-worker-fence-prerequisite"
          terminal="$prerequisite_root/automatic-maintenance-worker-fence-terminal.json"
          test -d "$prerequisite_root"
          test ! -L "$prerequisite_root"
          test -f "$terminal"
          test ! -L "$terminal"
          test "$(find "$prerequisite_root" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = '1'
          chmod 600 "$terminal"
          ./node_modules/.bin/tsx scripts/verify-production-maintenance-role-limit-prerequisites.ts \
            --mode production-deploy \
            --candidate-sha "$CANDIDATE_SHA" \
            --fence-run-id "$FENCE_RUN_ID" \
            --fence-terminal-file "$terminal" \
            --output "$RUNNER_TEMP/pintpath-production-deployment-evidence/production-deployment-worker-fence-verification.json"

      - name: Require current main checks, artifacts, and staging deployment
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/github-candidate-evidence"
          npm run --silent github:release-candidate:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --phase production \
            --output "$RUNNER_TEMP/github-candidate-evidence/required-checks.json"

      - name: Validate the candidate-bound release-evidence register
        run: npm run --silent release:evidence

      - name: Verify fresh protected production provider-readiness envelope v2
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROVIDER_READINESS_ENVELOPE_BASE64: ${{ secrets.PINTPATH_PRODUCTION_PROVIDER_READINESS_ENVELOPE_BASE64 }}
          PROVIDER_READINESS_ENVELOPE_SHA256: ${{ secrets.PINTPATH_PRODUCTION_PROVIDER_READINESS_ENVELOPE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROVIDER_READINESS_ENVELOPE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          private_root="$RUNNER_TEMP/production-provider-readiness"
          cleanup_private_readiness() {
            if [ -d "$private_root" ] && [ ! -L "$private_root" ]; then
              find "$private_root" -depth -mindepth 1 -delete
              rmdir "$private_root"
            fi
          }
          trap cleanup_private_readiness EXIT
          mkdir -m 700 "$private_root"
          envelope="$private_root/provider-readiness-envelope.json"
          printf '%s' "$PROVIDER_READINESS_ENVELOPE_BASE64" \
            | base64 --decode > "$envelope"
          chmod 600 "$envelope"
          npm run --silent production:provider-readiness:receipt:verify -- \
            --receipt "$envelope" \
            --expected-sha256 "$PROVIDER_READINESS_ENVELOPE_SHA256" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/github-candidate-evidence/provider-readiness-verification.json"

      - name: Require the reviewed provider-readiness implementation contract
        run: >-
          npx vitest run
          test/provider-readiness-reporting.test.ts
          test/production-provider-readiness-receipt.test.ts
          test/env-config.test.ts
          --maxWorkers=1

      - name: Install the exact reviewed Railway CLI archive
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/pintpath-railway-cli"
          cli_archive="$cli_root/railway-5.32.0-x86_64-linux.tar.gz"
          mkdir -m 700 "$cli_root"
          curl --fail --silent --show-error --location \
            'https://github.com/railwayapp/cli/releases/download/v5.32.0/railway-v5.32.0-x86_64-unknown-linux-musl.tar.gz' \
            --output "$cli_archive"
          echo 'cd69b2ecb556601751165d85ac31a5fbc38cff46397939356df28d2b96a005f5  '"$cli_archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$cli_archive" --directory "$cli_root" \
            --no-same-owner --no-same-permissions
          cli_path="$cli_root/railway"
          test -f "$cli_path"
          echo '27133cfc20bffc43b2f32c1638fa3c50eefc2f9d2d80301a93de34632ccb7a43  '"$cli_path" \
            | sha256sum --check --strict
          chmod 500 "$cli_path"
          test "$("$cli_path" --version)" = 'railway 5.32.0'
          chmod 400 "$cli_archive"
          {
            echo "PINTPATH_RAILWAY_CLI_PATH=$cli_path"
            echo "PINTPATH_RAILWAY_CLI_ARCHIVE=$cli_archive"
          } >> "$GITHUB_ENV"

      - name: Reassert current main immediately before the provider write
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Execute one protected production source upload and reconcile it
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_WRITE_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_DEPLOY_TOKEN }}
          PINTPATH_PRODUCTION_DEPLOYMENT_FENCE_RUN_ID: ${{ inputs.fence_run_id }}
          PINTPATH_PRODUCTION_DEPLOYMENT_WORKER_FENCE_VERIFICATION_FILE: ${{ runner.temp }}/pintpath-production-deployment-evidence/production-deployment-worker-fence-verification.json
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent railway:production:app:deploy -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence-dir "$RUNNER_TEMP/pintpath-production-deployment-evidence" \
            --production-worker-fence-run-id "$PINTPATH_PRODUCTION_DEPLOYMENT_FENCE_RUN_ID" \
            --production-worker-fence-verification-file "$PINTPATH_PRODUCTION_DEPLOYMENT_WORKER_FENCE_VERIFICATION_FILE"

      - name: Bind the artifact to the tested commit
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CANDIDATE_SHA" \
            > "$RUNNER_TEMP/pintpath-production-deployment-evidence/tested-commit-sha.txt"
          chmod 600 "$RUNNER_TEMP/pintpath-production-deployment-evidence/tested-commit-sha.txt"

      - name: Upload immutable production deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-deployment-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/github-candidate-evidence/required-checks.json
            ${{ runner.temp }}/github-candidate-evidence/provider-readiness-verification.json
            ${{ runner.temp }}/pintpath-production-deployment-evidence/
          if-no-files-found: error
          retention-days: 30
