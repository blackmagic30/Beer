name: Prove Pint Path permanent-staging two-replica scale

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently deployed from main
        required: true
        type: string
      activation_run_id:
        description: Successful same-candidate permanent-staging worker activation run
        required: true
        type: string
      active_deployment_run_id:
        description: Successful same-candidate active deployment closeout run
        required: true
        type: string
      confirmation:
        description: SCALE_PERMANENT_STAGING_TO_TWO_FOR_EVIDENCE
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-permanent-staging-key-rollout
  queue: max
  cancel-in-progress: false

jobs:
  scale-evidence:
    name: Scale 1→2, prove, and converge 2→1
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    environment: permanent-staging-scale-evidence

    steps:
      - name: Checkout the exact main candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require the exact current main candidate and confirmation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          ACTIVE_DEPLOYMENT_RUN_ID: ${{ inputs.active_deployment_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$RUN_ATTEMPT" = '1'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$CONFIRMATION" = 'SCALE_PERMANENT_STAGING_TO_TWO_FOR_EVIDENCE'
          [[ "$ACTIVATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ACTIVE_DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$ACTIVATION_RUN_ID" != "$ACTIVE_DEPLOYMENT_RUN_ID"
          test "$ACTIVATION_RUN_ID" != "$RUN_ID"
          test "$ACTIVE_DEPLOYMENT_RUN_ID" != "$RUN_ID"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Install the exact reviewed Railway CLI archive
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/pintpath-railway-cli"
          cli_archive="$cli_root/railway-5.32.0-x86_64-linux.tar.gz"
          mkdir -m 700 "$cli_root"
          curl --fail --silent --show-error --location \
            'https://github.com/railwayapp/cli/releases/download/v5.32.0/railway-v5.32.0-x86_64-unknown-linux-musl.tar.gz' \
            --output "$cli_archive"
          echo 'cd69b2ecb556601751165d85ac31a5fbc38cff46397939356df28d2b96a005f5  '"$cli_archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$cli_archive" --directory "$cli_root" \
            --no-same-owner --no-same-permissions
          cli_path="$cli_root/railway"
          echo '27133cfc20bffc43b2f32c1638fa3c50eefc2f9d2d80301a93de34632ccb7a43  '"$cli_path" \
            | sha256sum --check --strict
          chmod 500 "$cli_path"
          test "$("$cli_path" --version)" = 'railway 5.32.0'
          echo "PINTPATH_RAILWAY_CLI_PATH=$cli_path" >> "$GITHUB_ENV"

      - name: Create private evidence custody
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pintpath-scale-evidence"
          mkdir -m 700 "$RUNNER_TEMP/pintpath-load-input"
          install -d -m 700 \
            "$RUNNER_TEMP/pintpath-scale-prerequisites" \
            "$RUNNER_TEMP/pintpath-scale-prerequisites/activate" \
            "$RUNNER_TEMP/pintpath-scale-prerequisites/active-deployment" \
            "$RUNNER_TEMP/pintpath-scale-prerequisites/sealed"
          printf '%s\n' "$CANDIDATE_SHA" \
            > "$RUNNER_TEMP/pintpath-scale-evidence/tested-commit-sha.txt"
          chmod 600 "$RUNNER_TEMP/pintpath-scale-evidence/tested-commit-sha.txt"

      - name: Verify the complete repository before provider writes
        run: npm run check

      - name: Retrieve the exact staging worker activation artifact
        uses: actions/download-artifact@b7c52a5f7a25fce4c22e476a93420dd79a061a70 # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.activation_run_id }}
          name: pintpath-automatic-maintenance-worker-fence-permanent-staging-activate-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-scale-prerequisites/activate

      - name: Retrieve the exact active staging deployment artifact
        uses: actions/download-artifact@b7c52a5f7a25fce4c22e476a93420dd79a061a70 # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.active_deployment_run_id }}
          name: pintpath-permanent-staging-deployment-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-scale-prerequisites/active-deployment

      - name: Seal and verify the exact active staging prerequisites
        env:
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          ACTIVE_DEPLOYMENT_RUN_ID: ${{ inputs.active_deployment_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          PINTPATH_STAGING_WORKER_BOOTSTRAP_GITHUB_ENVIRONMENT: permanent-staging-scale-evidence
          PINTPATH_STAGING_WORKER_BOOTSTRAP_OPERATION: scale-evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pintpath-scale-prerequisites"
          seal_one() {
            local source_root="$1"
            local leaf="$2"
            local destination="$3"
            mapfile -d '' matches < <(find "$source_root" -type f -name "$leaf" -print0)
            test "${#matches[@]}" = 1
            test ! -L "${matches[0]}"
            test ! -e "$destination"
            cp --no-dereference -- "${matches[0]}" "$destination"
            chmod 600 "$destination"
          }
          install -d -m 700 "$root/sealed/activate" "$root/sealed/active-deployment"
          seal_one "$root/activate" automatic-maintenance-worker-fence-terminal.json \
            "$root/sealed/activate/automatic-maintenance-worker-fence-terminal.json"
          seal_one "$root/active-deployment" deployment-receipt.json \
            "$root/sealed/active-deployment/deployment-receipt.json"
          ./node_modules/.bin/tsx \
            scripts/verify-permanent-staging-worker-bootstrap-prerequisites.ts \
            --operation scale-evidence \
            --candidate-sha "$CANDIDATE_SHA" \
            --activate-run-id "$ACTIVATION_RUN_ID" \
            --activate-terminal-file "$root/sealed/activate/automatic-maintenance-worker-fence-terminal.json" \
            --active-deployment-run-id "$ACTIVE_DEPLOYMENT_RUN_ID" \
            --active-deployment-receipt-file "$root/sealed/active-deployment/deployment-receipt.json" \
            --output "$RUNNER_TEMP/pintpath-scale-evidence/prerequisites-verification.json"

      - name: Remove downloaded staging scale prerequisite custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          custody="$RUNNER_TEMP/pintpath-scale-prerequisites"
          if [[ -d "$custody" && ! -L "$custody" ]]; then
            find "$custody" -depth -mindepth 1 -delete
            rmdir "$custody"
          fi

      - name: Reassert exact current main immediately before scale-out
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Scale the exact staging deployment from one to two once
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_SCALE_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_SCALE_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_SCALE_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-scale.ts \
            --direction out \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence-dir "$RUNNER_TEMP/pintpath-scale-evidence"

      - name: Stage disposable load identities and reviewed fixture
        env:
          USER_A_TOKEN: ${{ secrets.PINTPATH_STAGING_LOAD_USER_A_TOKEN }}
          USER_B_TOKEN: ${{ secrets.PINTPATH_STAGING_LOAD_USER_B_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.PINTPATH_STAGING_LOAD_ADMIN_TOKEN }}
          WRITE_FIXTURE: ${{ secrets.PINTPATH_STAGING_LOAD_WRITE_FIXTURE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$USER_A_TOKEN"
          test -n "$USER_B_TOKEN"
          test -n "$ADMIN_TOKEN"
          test -n "$WRITE_FIXTURE"
          test "$USER_A_TOKEN" != "$USER_B_TOKEN"
          test "$USER_A_TOKEN" != "$ADMIN_TOKEN"
          test "$USER_B_TOKEN" != "$ADMIN_TOKEN"
          umask 077
          printf '%s' "$USER_A_TOKEN" > "$RUNNER_TEMP/pintpath-load-input/user-a"
          printf '%s' "$USER_B_TOKEN" > "$RUNNER_TEMP/pintpath-load-input/user-b"
          printf '%s' "$ADMIN_TOKEN" > "$RUNNER_TEMP/pintpath-load-input/admin"
          printf '%s' "$WRITE_FIXTURE" > "$RUNNER_TEMP/pintpath-load-input/fixture.json"
          fixture_sha="$(sha256sum "$RUNNER_TEMP/pintpath-load-input/fixture.json" | cut -d' ' -f1)"
          {
            echo 'PINTPATH_STAGING_LOAD_MUTATION=confirmed'
            echo 'PINTPATH_STAGING_LOAD_DISPOSABLE_USERS=confirmed'
            echo 'PINTPATH_STAGING_LOAD_BASE_URL=https://beer-staging.up.railway.app'
            echo 'PINTPATH_STAGING_LOAD_EXPECTED_HOSTNAME=beer-staging.up.railway.app'
            echo 'PINTPATH_STAGING_LOAD_EXPECTED_ORIGIN_SHA256=4532dc3b87deb570735196a86cd1b75ddc490c752dd6993e2f0d7bcb7df8161b'
            echo 'PINTPATH_STAGING_LOAD_PRODUCTION_ORIGIN_SHA256=a3a1a2e58fa4038b741e1c213af02708e09ae901005c7c31f919e0a4dea46e90'
            echo 'PINTPATH_STAGING_LOAD_RESTORE_ORIGIN_SHA256=c96d015a9e8b6cd9392f8ea810ce70049607bcb9d66c250a545f8cf95b13bbbd'
            echo "PINTPATH_STAGING_LOAD_EXPECTED_COMMIT_SHA=${{ inputs.candidate_sha }}"
            echo 'PINTPATH_PERMANENT_STAGING_RAILWAY_PROJECT_ID=48d8c6cd-1c66-4148-874b-20877f48e1a5'
            echo 'PINTPATH_PERMANENT_STAGING_RAILWAY_ENVIRONMENT_ID=a4e0f507-d6d3-4df9-a818-ad92c0071a35'
            echo 'PINTPATH_PERMANENT_STAGING_RAILWAY_SERVICE_ID=6816c4a2-e392-4ee5-826f-2584cb599ec0'
            echo 'PINTPATH_STAGING_LOAD_EXPECTED_IDENTITY_SHA256=6cfbee9a23b44c649e7e9767a51dbe5fbf5a58cd3e09360e6925bc13a5213525'
            echo 'PINTPATH_STAGING_LOAD_EXPECTED_RPS=2'
            echo 'PINTPATH_STAGING_LOAD_EXPECTED_CONCURRENCY=4'
            echo 'PINTPATH_STAGING_LOAD_EXPECTED_REPLICA_COUNT=2'
            echo "PINTPATH_STAGING_LOAD_USER_A_TOKEN_FILE=$RUNNER_TEMP/pintpath-load-input/user-a"
            echo "PINTPATH_STAGING_LOAD_USER_B_TOKEN_FILE=$RUNNER_TEMP/pintpath-load-input/user-b"
            echo "PINTPATH_STAGING_LOAD_ADMIN_TOKEN_FILE=$RUNNER_TEMP/pintpath-load-input/admin"
            echo "PINTPATH_STAGING_LOAD_WRITE_FIXTURE_FILE=$RUNNER_TEMP/pintpath-load-input/fixture.json"
            echo "PINTPATH_STAGING_LOAD_WRITE_FIXTURE_SHA256=$fixture_sha"
          } >> "$GITHUB_ENV"

      - name: Prove expected peak across both replicas
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent staging:load:soak -- \
            --profile=expected-peak --duration-minutes=5 \
            > "$RUNNER_TEMP/pintpath-scale-evidence/expected-peak.json"
          chmod 600 "$RUNNER_TEMP/pintpath-scale-evidence/expected-peak.json"

      - name: Prove 2x peak across both replicas
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent staging:load:soak -- \
            --profile=2x-peak --duration-minutes=5 \
            > "$RUNNER_TEMP/pintpath-scale-evidence/two-x-peak.json"
          chmod 600 "$RUNNER_TEMP/pintpath-scale-evidence/two-x-peak.json"

      - name: Prove the minimum 60-minute two-replica soak
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent staging:load:soak -- \
            --profile=soak --duration-minutes=60 \
            > "$RUNNER_TEMP/pintpath-scale-evidence/soak.json"
          chmod 600 "$RUNNER_TEMP/pintpath-scale-evidence/soak.json"

      - name: Remove disposable load input custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/pintpath-load-input"
          if test -d "$input_root"; then
            find "$input_root" -type f -exec shred -u -- {} + 2>/dev/null \
              || find "$input_root" -type f -exec rm -f -- {} +
            find "$input_root" -depth -type d -exec rmdir -- {} +
          fi
          test ! -e "$input_root"

      - name: Reassert the authorized source immediately before safe convergence
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Unconditionally converge permanent staging to one replica
        if: always()
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_SCALE_CONFIRMATION: CONVERGE_PERMANENT_STAGING_TO_ONE
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_SCALE_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_SCALE_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-scale.ts \
            --direction converge-one \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence-dir "$RUNNER_TEMP/pintpath-scale-evidence"

      - name: Reconcile the Railway mutation boundary after convergence
        if: always()
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        run: npm run readiness:railway:mutation-boundary

      - name: Upload the scale and load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-permanent-staging-scale-evidence-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-scale-evidence/
          if-no-files-found: error
          retention-days: 30
