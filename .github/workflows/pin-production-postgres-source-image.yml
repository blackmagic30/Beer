name: DO NOT DISPATCH - blocked production Postgres source pin
run-name: Pin production Postgres source | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: DO NOT DISPATCH until compatibility and durability authorities are ACTIVE; dispatch is single-use
        required: true
        type: string
      backup_run_id:
        description: Same-candidate successful backup-and-restore-drill run ID; not a dry run
        required: true
        type: string
      confirmation:
        description: PIN_PRODUCTION_POSTGRES_SOURCE_TO_OBSERVED_DIGEST
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-production-postgres-source-pin
  cancel-in-progress: false

jobs:
  prepare:
    name: Prove blocked source-pin authority without provider credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      recovery_authority_file_sha256: ${{ steps.recovery.outputs.sha256 }}
      prepared_artifact_id: ${{ steps.prepared_artifact.outputs.artifact-id }}
      prepared_artifact_digest: ${{ steps.prepared_artifact.outputs.artifact-digest }}

    steps:
      - name: Checkout the exact current main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require the original exact dispatch and fixed confirmation
        env:
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BACKUP_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$CONFIRMATION" = 'PIN_PRODUCTION_POSTGRES_SOURCE_TO_OBSERVED_DIGEST'
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$RUN_ATTEMPT" = '1'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the exact repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify the exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.2'
          test "$(corepack npm --version)" = '10.9.8'

      - name: Install immutable dependencies without lifecycle scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify the source-pin repository contracts
        run: corepack npm run production:postgres-source-pin:contract:check

      - name: Create private secret-free preparation custody
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/pintpath-source-pin-recovery-output"

      - name: Authenticate the merged candidate, single use, and live main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          corepack npm run --silent github:production-postgres-source-pin-authority:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            > /dev/null

      - name: Hard-stop until compatibility and durability authorities are active
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          corepack npm run --silent production:postgres-source-pin:compatibility:verify \
            > /dev/null

      - name: Materialize exact fresh recovery authority in an empty custody root
        id: recovery
        env:
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$(corepack npm run --silent github:production-postgres-source-pin-recovery:materialize -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --backup-run-id "$BACKUP_RUN_ID" \
            --output "$RUNNER_TEMP/pintpath-source-pin-recovery-output/recovery-authority.json")"
          test "$(find "$RUNNER_TEMP/pintpath-source-pin-recovery-output" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = '1'
          recovery_sha="$(RECEIPT="$receipt" node -e 'const v=JSON.parse(process.env.RECEIPT);if(v.ok!==true||!/^[a-f0-9]{64}$/.test(v.outputSha256))process.exit(1);process.stdout.write(v.outputSha256)')"
          test "$(sha256sum "$RUNNER_TEMP/pintpath-source-pin-recovery-output/recovery-authority.json" | cut -d ' ' -f 1)" = "$recovery_sha"
          printf 'sha256=%s\n' "$recovery_sha" >> "$GITHUB_OUTPUT"

      - name: Retain the exact secret-free prepared authority
        id: prepared_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-postgres-source-pin-prepared-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-source-pin-recovery-output/recovery-authority.json
          if-no-files-found: error
          retention-days: 7

  pin:
    name: Pin and reconcile exact production Postgres source
    needs: prepare
    runs-on: [self-hosted, linux, x64, pintpath-production-backup]
    timeout-minutes: 25
    environment: production-postgres-source-pin
    env:
      PINTPATH_PRODUCTION_BACKUP_RUNNER_READY: ${{ vars.PINTPATH_PRODUCTION_BACKUP_RUNNER_READY }}
      PINTPATH_PRODUCTION_BACKUP_EPHEMERAL_RUNNER_POLICY_SHA256: ${{ vars.PINTPATH_PRODUCTION_BACKUP_EPHEMERAL_RUNNER_POLICY_SHA256 }}
      PINTPATH_PRODUCTION_BACKUP_SOURCE_URL_SHA256: ${{ vars.PINTPATH_PRODUCTION_BACKUP_SOURCE_URL_SHA256 }}
      PINTPATH_PRODUCTION_POSTGRES_ROOT_CA_DER_SHA256: ${{ vars.PINTPATH_PRODUCTION_POSTGRES_ROOT_CA_DER_SHA256 }}

    steps:
      - name: Checkout the exact authorized candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Setup the exact repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify the exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.2'
          test "$(corepack npm --version)" = '10.9.8'

      - name: Install immutable dependencies without lifecycle scripts
        run: corepack npm ci --ignore-scripts

      - name: Reassert live current main before protected credentials
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          corepack npm run --silent github:production-postgres-source-pin-authority:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            > /dev/null
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Verify the volatile private runner before materializing secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$PINTPATH_PRODUCTION_BACKUP_RUNNER_READY" = 'true'
          [[ "$PINTPATH_PRODUCTION_BACKUP_EPHEMERAL_RUNNER_POLICY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PINTPATH_PRODUCTION_BACKUP_SOURCE_URL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PINTPATH_PRODUCTION_POSTGRES_ROOT_CA_DER_SHA256" =~ ^[a-f0-9]{64}$ ]]
          node scripts/verify-production-backup-volatile-work-root.mjs verify \
            --policy-sha256="$PINTPATH_PRODUCTION_BACKUP_EPHEMERAL_RUNNER_POLICY_SHA256"

      - name: Prepare one volatile recovery work root
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work_root="$(node scripts/verify-production-backup-volatile-work-root.mjs prepare \
            --operation=recovery \
            --run-id="$GITHUB_RUN_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --policy-sha256="$PINTPATH_PRODUCTION_BACKUP_EPHEMERAL_RUNNER_POLICY_SHA256" \
            --github-env="$GITHUB_ENV")"
          test "$work_root" = "/run/pintpath-production-backup/pintpath-production-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$work_root/prepared" "$work_root/source-pin-evidence"

      - name: Download this run's exact prepared authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          merge-multiple: true
          path: /run/pintpath-production-backup/pintpath-production-recovery-${{ github.run_id }}-${{ github.run_attempt }}/prepared

      - name: Reassert private authority custody and candidate binding
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_RECOVERY_AUTHORITY_FILE_SHA256: ${{ needs.prepare.outputs.recovery_authority_file_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$PINTPATH_RECOVERY_WORK_ROOT/prepared"
          chmod 600 "$PINTPATH_RECOVERY_WORK_ROOT/prepared/"*.json
          test "$(find "$PINTPATH_RECOVERY_WORK_ROOT/prepared" -mindepth 1 -maxdepth 1 -type f -name 'recovery-authority.json' | wc -l | tr -d ' ')" = '1'
          test "$(sha256sum "$PINTPATH_RECOVERY_WORK_ROOT/prepared/recovery-authority.json" | cut -d ' ' -f 1)" = "$EXPECTED_RECOVERY_AUTHORITY_FILE_SHA256"
          node -e 'const f=require("fs");const v=JSON.parse(f.readFileSync(process.argv[1],"utf8"));if(v.candidateSha!==process.argv[2])process.exit(1)' \
            "$PINTPATH_RECOVERY_WORK_ROOT/prepared/recovery-authority.json" \
            "$CANDIDATE_SHA"

      - name: Create exact private dispatch evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const v={schemaVersion:"pintpath-production-postgres-source-pin-dispatch/v1",candidateSha:process.env.CANDIDATE_SHA,secretMaterialIncluded:false};process.stdout.write(`${JSON.stringify(v,null,2)}\n`)' \
            > "$PINTPATH_RECOVERY_WORK_ROOT/source-pin-evidence/dispatch.json"
          chmod 600 "$PINTPATH_RECOVERY_WORK_ROOT/source-pin-evidence/dispatch.json"

      - name: Materialize private database identity inputs after main reassertion
        env:
          BACKUP_DATABASE_URL: ${{ secrets.PINTPATH_PRODUCTION_BACKUP_DATABASE_URL }}
          POSTGRES_ROOT_CA_PEM: ${{ secrets.PINTPATH_PRODUCTION_POSTGRES_ROOT_CA_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$BACKUP_DATABASE_URL"
          test -n "$POSTGRES_ROOT_CA_PEM"
          printf '%s' "$BACKUP_DATABASE_URL" > "$PINTPATH_RECOVERY_WORK_ROOT/postgres-backup-url"
          printf '%s' "$POSTGRES_ROOT_CA_PEM" > "$PINTPATH_RECOVERY_WORK_ROOT/railway-postgres-root-ca.pem"
          chmod 600 "$PINTPATH_RECOVERY_WORK_ROOT/postgres-backup-url" \
            "$PINTPATH_RECOVERY_WORK_ROOT/railway-postgres-root-ca.pem"

      - name: Run the read-only production and staging mutation boundary first
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          receipt="$(corepack npm run --silent readiness:railway:mutation-boundary)"
          code=$?
          set -e
          test "$code" -eq 1
          RECEIPT="$receipt" node -e 'const v=JSON.parse(process.env.RECEIPT);const failed=Object.entries(v.checks).filter(([,x])=>x!==true).map(([k])=>k);if(v.outcome!=="failed"||failed.length!==1||failed[0]!=="sourceReferenceImmutable")process.exit(1)'

      - name: Reassert exact current main immediately before the write boundary
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          corepack npm run --silent github:production-postgres-source-pin-authority:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            > /dev/null
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Commit exact immutable production Postgres source once
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_PREPARED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.prepared_artifact_digest }}
          EXPECTED_PREPARED_ARTIFACT_ID: ${{ needs.prepare.outputs.prepared_artifact_id }}
          EXPECTED_RECOVERY_AUTHORITY_FILE_SHA256: ${{ needs.prepare.outputs.recovery_authority_file_sha256 }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_PIN_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_PRODUCTION_POSTGRES_SOURCE_MUTATION_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_POSTGRES_SOURCE_MUTATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          corepack npm run --silent railway:production:postgres-source-pin:protected -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --recovery-authority "$PINTPATH_RECOVERY_WORK_ROOT/prepared/recovery-authority.json" \
            --expected-recovery-authority-file-sha256 "$EXPECTED_RECOVERY_AUTHORITY_FILE_SHA256" \
            --expected-prepared-artifact-id "$EXPECTED_PREPARED_ARTIFACT_ID" \
            --expected-prepared-artifact-digest "$EXPECTED_PREPARED_ARTIFACT_DIGEST" \
            --evidence-dir "$PINTPATH_RECOVERY_WORK_ROOT/source-pin-evidence" \
            --database-url-file "$PINTPATH_RECOVERY_WORK_ROOT/postgres-backup-url" \
            --root-ca-file "$PINTPATH_RECOVERY_WORK_ROOT/railway-postgres-root-ca.pem"

      - name: Upload secret-free terminal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-postgres-source-pin-evidence-${{ inputs.candidate_sha }}
          path: /run/pintpath-production-backup/pintpath-production-recovery-${{ github.run_id }}-${{ github.run_attempt }}/source-pin-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Destroy all volatile source-pin material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          node scripts/verify-production-backup-volatile-work-root.mjs cleanup \
            --operation=recovery \
            --run-id="$GITHUB_RUN_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --policy-sha256="$PINTPATH_PRODUCTION_BACKUP_EPHEMERAL_RUNNER_POLICY_SHA256" \
            --exported-work-root="${PINTPATH_RECOVERY_WORK_ROOT:-}"
