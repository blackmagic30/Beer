name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_PATH: ./data/ci.sqlite
      OUTBOUND_CALLS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and scan
        run: npm run check

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit

  supabase-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Start isolated Supabase database
        run: supabase db start

      - name: Rebuild database from migrations
        run: supabase db reset --local

      - name: Lint database schemas
        run: supabase db lint --local --schema public,private --level warning --fail-on warning

      - name: Run security advisors
        run: supabase db advisors --local --type security --level warn --fail-on warn

      - name: Report performance advisors
        run: supabase db advisors --local --type performance --level warn --fail-on error

      - name: Run pgTAP database tests
        run: supabase test db --local supabase/tests

      - name: Stop isolated Supabase database
        if: always()
        run: supabase stop --no-backup
