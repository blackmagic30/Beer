name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - security-hardening-p0-p1

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and scan
        run: npm run check

      - name: Secret scan
        run: npm run security:scan
