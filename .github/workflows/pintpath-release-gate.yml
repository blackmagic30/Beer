name: Pint Path Release Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main and deployed to staging and production
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: pintpath-production-release-gate
  cancel-in-progress: false

jobs:
  production-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PINTPATH_SMOKE_BASE_URL: https://pintpath.au
      PINTPATH_EXPECTED_COMMIT_SHA: ${{ inputs.candidate_sha }}
      PINTPATH_ENFORCE_LAUNCH_FLAGS: "true"
      PINTPATH_EXPECTED_COMMERCIAL_LAUNCH_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require the exact current main candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require current main checks and deployment artifacts
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/github-release-candidate-evidence"
          npm run --silent github:release-candidate:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --phase release \
            --output "$RUNNER_TEMP/github-release-candidate-evidence/required-checks.json"

      - name: Validate protected deployment and cost-evidence contracts
        run: npm run permanent-staging:cost:contract:check

      - name: Prove activated reviewed-price kernel and protected operator contracts
        run: |
          npm run db:postgres:reviewed-price:kernel:contract:check
          npm run db:postgres:reviewed-price:operator:contract:check

      - name: Prove logical-state v2 remains additive and fail-closed
        run: npm run db:postgres:logical-state:v2:contract:check

      - name: Prove passive logical-backup V4 contracts remain fail-closed
        run: npm run db:postgres:backup:v4:offline-contract:check

      - name: Prove operational digest-pinned PostgreSQL backup and restore runtime
        run: npm run db:postgres:backup:oci-runtime:contract:check

      - name: Build
        run: npm run build

      - name: Prove Supabase key consumer compatibility
        run: npm run supabase:keys:consumer-compatibility:check

      - name: Prove canonical PostgreSQL runtime selection
        run: >-
          npx vitest run
          test/runtime-persistence.test.ts
          test/provider-readiness-reporting.test.ts

      - name: Automated release-readiness tests
        env:
          NODE_ENV: test
          DATABASE_PATH: ./data/ci-production-release-gate.sqlite
          PINTPATH_TEST_DATABASE_PATH: ./data/ci-production-release-gate.sqlite
        run: npm run test:e2e:pintpath

      - name: Enforce public production health, commit, and launch flags
        run: |
          set -o pipefail
          npm run --silent smoke:production | tee production-public-smoke.json

      - name: Enforce empty Railway mutation boundary and production image authority
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        run: |
          set -o pipefail
          npm run --silent readiness:railway:mutation-boundary | tee railway-mutation-boundary-readiness.json

      - name: Enforce permanent-staging sealed-variable metadata
        env:
          PINTPATH_RAILWAY_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_METADATA_TOKEN }}
        run: |
          set -o pipefail
          npm run --silent readiness:railway:sealed | tee railway-sealed-variable-readiness.json

      - name: Verify authenticated production roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PINTPATH_SMOKE_USER_EMAIL: ${{ secrets.PINTPATH_SMOKE_USER_EMAIL }}
          PINTPATH_SMOKE_USER_PASSWORD: ${{ secrets.PINTPATH_SMOKE_USER_PASSWORD }}
          PINTPATH_SMOKE_VENUE_EMAIL: ${{ secrets.PINTPATH_SMOKE_VENUE_EMAIL }}
          PINTPATH_SMOKE_VENUE_PASSWORD: ${{ secrets.PINTPATH_SMOKE_VENUE_PASSWORD }}
          PINTPATH_SMOKE_ADMIN_TOKEN: ${{ secrets.PINTPATH_SMOKE_ADMIN_TOKEN }}
          PINTPATH_REVOKE_DIRECT_SMOKE_TOKENS: "true"
        run: |
          set -o pipefail
          npm run --silent smoke:production:auth | tee production-role-smoke.json

      - name: Enforce production public data readiness
        env:
          PINTPATH_DATA_BASE_URL: https://pintpath.au
          PINTPATH_DATA_STRICT: "true"
          PINTPATH_DATA_MARKETED_SUBURBS: ${{ vars.PINTPATH_DATA_MARKETED_SUBURBS }}
          PINTPATH_DATA_MIN_MARKETED_VENUE_COVERAGE_PERCENT: "70"
          PINTPATH_DATA_MIN_CURRENT_PRICES_PER_VENUE: "3"
          PINTPATH_DATA_MAX_CORE_FRESHNESS_HOURS: "48"
          PINTPATH_DATA_MAX_VENUE_STATUS_AGE_HOURS: "24"
          PINTPATH_DATA_MAX_TRUSTED_ROW_AGE_DAYS: "30"
          PINTPATH_DATA_MIN_HAPPY_HOUR_COVERAGE_PERCENT: "25"
          PINTPATH_DATA_NO_HAPPY_HOUR_LAUNCH_SCOPE: "true"
          PINTPATH_DATA_NO_HAPPY_HOUR_SCOPE_REFERENCE: ${{ vars.PINTPATH_DATA_NO_HAPPY_HOUR_SCOPE_REFERENCE }}
        run: |
          set -o pipefail
          npm run --silent readiness:data | tee production-data-readiness.json

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit

      - name: Record tested immutable commit
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.candidate_sha }}'
          git rev-parse HEAD | tee tested-commit-sha.txt

      - name: Enforce external launch evidence
        run: |
          set -o pipefail
          npm run --silent release:evidence:strict | tee release-evidence-summary.json

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-release-gate-${{ inputs.candidate_sha }}
          path: |
            docs/release-evidence.json
            ${{ runner.temp }}/github-release-candidate-evidence/required-checks.json
            production-public-smoke.json
            production-data-readiness.json
            production-role-smoke.json
            release-evidence-summary.json
            railway-mutation-boundary-readiness.json
            railway-sealed-variable-readiness.json
            tested-commit-sha.txt
          if-no-files-found: error
