name: Pint Path Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pintpath-production-release-gate
  cancel-in-progress: false

jobs:
  production-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PINTPATH_SMOKE_BASE_URL: https://pintpath.au
      PINTPATH_EXPECTED_COMMIT_SHA: ${{ github.sha }}
      PINTPATH_ENFORCE_LAUNCH_FLAGS: "true"
      PINTPATH_EXPECTED_COMMERCIAL_LAUNCH_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prove canonical PostgreSQL runtime selection
        run: >-
          npx vitest run
          test/runtime-persistence.test.ts
          test/provider-readiness-reporting.test.ts

      - name: Automated release-readiness tests
        env:
          NODE_ENV: test
          DATABASE_PATH: ./data/ci-production-release-gate.sqlite
          PINTPATH_TEST_DATABASE_PATH: ./data/ci-production-release-gate.sqlite
        run: npm run test:e2e:pintpath

      - name: Enforce public production health, commit, and launch flags
        run: |
          set -o pipefail
          npm run --silent smoke:production | tee production-public-smoke.json

      - name: Enforce production provider readiness
        env:
          NODE_ENV: production
          PUBLIC_BASE_URL: https://pintpath.au
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OAUTH_PROVIDERS: google
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINTPATH_DATABASE_RESOURCE_ID: ${{ secrets.PINTPATH_DATABASE_RESOURCE_ID }}
          PINTPATH_EXPECTED_DATABASE_RESOURCE_ID: ${{ secrets.PINTPATH_EXPECTED_DATABASE_RESOURCE_ID }}
          PINTPATH_FORBIDDEN_DATABASE_RESOURCE_IDS: ${{ secrets.PINTPATH_FORBIDDEN_DATABASE_RESOURCE_IDS }}
          PINTPATH_EXPECTED_DATABASE_URL_SHA256: ${{ secrets.PINTPATH_EXPECTED_DATABASE_URL_SHA256 }}
          PINTPATH_FORBIDDEN_DATABASE_URL_SHA256S: ${{ secrets.PINTPATH_FORBIDDEN_DATABASE_URL_SHA256S }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PINTPATH_REDIS_RESOURCE_ID: ${{ secrets.PINTPATH_REDIS_RESOURCE_ID }}
          PINTPATH_EXPECTED_REDIS_RESOURCE_ID: ${{ secrets.PINTPATH_EXPECTED_REDIS_RESOURCE_ID }}
          PINTPATH_FORBIDDEN_REDIS_RESOURCE_IDS: ${{ secrets.PINTPATH_FORBIDDEN_REDIS_RESOURCE_IDS }}
          PINTPATH_EXPECTED_REDIS_URL_SHA256: ${{ secrets.PINTPATH_EXPECTED_REDIS_URL_SHA256 }}
          PINTPATH_FORBIDDEN_REDIS_URL_SHA256S: ${{ secrets.PINTPATH_FORBIDDEN_REDIS_URL_SHA256S }}
          REQUIRE_REDIS_RATE_LIMITING: "true"
          ALLOW_IN_MEMORY_RATE_LIMITING_IN_PRODUCTION: "false"
          SOURCE_EVIDENCE_SIGNING_SECRET: ${{ secrets.SOURCE_EVIDENCE_SIGNING_SECRET }}
          COMMERCIAL_LAUNCH_ENABLED: "false"
          CONSUMER_PAID_ENROLLMENT_ENABLED: "false"
          VENUE_PRO_TRIAL_DAYS: "0"
          VENUE_PRO_TRIAL_REQUIRE_PAYMENT_METHOD: "false"
          PINT_POINTS_REWARDS_ENABLED: "false"
          ALCOHOL_GAMIFICATION_ENABLED: "false"
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
          STRIPE_PRICE_MONTHLY: ""
          STRIPE_PRICE_YEARLY: ""
          STRIPE_PRO_PRICE_ID: ""
          POS_WEBHOOK_SIGNING_SECRET: ""
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          REQUIRE_ADMIN_MFA_IN_PRODUCTION: "true"
          FIELD_TEST_MODE: "false"
          OFFSITE_BACKUP_BUCKET: ${{ secrets.OFFSITE_BACKUP_BUCKET }}
          OFFSITE_BACKUP_SUPABASE_URL: ${{ secrets.OFFSITE_BACKUP_SUPABASE_URL }}
          OFFSITE_BACKUP_SERVICE_ROLE_KEY: ${{ secrets.OFFSITE_BACKUP_SERVICE_ROLE_KEY }}
          REPORT_TIMEZONE: Australia/Melbourne
          REPORT_EMAIL_MODE: disabled
          REPORT_DELIVERY_SCHEDULE_ENABLED: "false"
          PINTPATH_REPORT_DELIVER: "false"
          RESEND_API_KEY: ""
          ACCOUNT_DELETION_NOTICE_MODE: resend
          RESEND_TRANSACTIONAL_API_KEY: ${{ secrets.RESEND_TRANSACTIONAL_API_KEY }}
          ACCOUNT_DELETION_NOTICE_FROM: ${{ secrets.ACCOUNT_DELETION_NOTICE_FROM }}
          ACCOUNT_DELETION_NOTICE_REPLY_TO: ${{ secrets.ACCOUNT_DELETION_NOTICE_REPLY_TO }}
          RESEND_WEBHOOK_SIGNING_SECRET: ${{ secrets.RESEND_WEBHOOK_SIGNING_SECRET }}
          ACCOUNT_DELETION_NOTICE_ACTIVE_KEY_ID: ${{ secrets.ACCOUNT_DELETION_NOTICE_ACTIVE_KEY_ID }}
          ACCOUNT_DELETION_NOTICE_KEYRING_JSON: ${{ secrets.ACCOUNT_DELETION_NOTICE_KEYRING_JSON }}
          ACCOUNT_DELETION_NOTICE_CHECK_INTERVAL_MINUTES: "5"
          ACCOUNT_DELETION_REHEARSAL_ENABLED: "false"
          DEMO_BILLING_MODE: "false"
          ALLOW_DEMO_BILLING_IN_PRODUCTION: "false"
          ALLOW_DEMO_IMAGE_STORAGE_IN_PRODUCTION: "false"
        run: |
          set -o pipefail
          npm run --silent readiness:launch | tee provider-readiness-summary.json

      - name: Verify authenticated production roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PINTPATH_SMOKE_USER_EMAIL: ${{ secrets.PINTPATH_SMOKE_USER_EMAIL }}
          PINTPATH_SMOKE_USER_PASSWORD: ${{ secrets.PINTPATH_SMOKE_USER_PASSWORD }}
          PINTPATH_SMOKE_VENUE_EMAIL: ${{ secrets.PINTPATH_SMOKE_VENUE_EMAIL }}
          PINTPATH_SMOKE_VENUE_PASSWORD: ${{ secrets.PINTPATH_SMOKE_VENUE_PASSWORD }}
          PINTPATH_SMOKE_ADMIN_TOKEN: ${{ secrets.PINTPATH_SMOKE_ADMIN_TOKEN }}
          PINTPATH_REVOKE_DIRECT_SMOKE_TOKENS: "true"
        run: |
          set -o pipefail
          npm run --silent smoke:production:auth | tee production-role-smoke.json

      - name: Enforce production public data readiness
        env:
          PINTPATH_DATA_BASE_URL: https://pintpath.au
          PINTPATH_DATA_STRICT: "true"
          PINTPATH_DATA_MARKETED_SUBURBS: ${{ vars.PINTPATH_DATA_MARKETED_SUBURBS }}
          PINTPATH_DATA_MIN_MARKETED_VENUE_COVERAGE_PERCENT: "70"
          PINTPATH_DATA_MIN_CURRENT_PRICES_PER_VENUE: "3"
          PINTPATH_DATA_MAX_CORE_FRESHNESS_HOURS: "48"
          PINTPATH_DATA_MAX_VENUE_STATUS_AGE_HOURS: "24"
          PINTPATH_DATA_MAX_TRUSTED_ROW_AGE_DAYS: "30"
          PINTPATH_DATA_MIN_HAPPY_HOUR_COVERAGE_PERCENT: "25"
          PINTPATH_DATA_NO_HAPPY_HOUR_LAUNCH_SCOPE: "true"
          PINTPATH_DATA_NO_HAPPY_HOUR_SCOPE_REFERENCE: ${{ vars.PINTPATH_DATA_NO_HAPPY_HOUR_SCOPE_REFERENCE }}
        run: |
          set -o pipefail
          npm run --silent readiness:data | tee production-data-readiness.json

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit

      - name: Record tested immutable commit
        run: |
          set -o pipefail
          git rev-parse HEAD | tee tested-commit-sha.txt

      - name: Enforce external launch evidence
        run: |
          set -o pipefail
          npm run --silent release:evidence:strict | tee release-evidence-summary.json

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-release-gate
          path: |
            docs/release-evidence.json
            production-public-smoke.json
            production-data-readiness.json
            production-role-smoke.json
            release-evidence-summary.json
            provider-readiness-summary.json
            tested-commit-sha.txt
          if-no-files-found: warn
