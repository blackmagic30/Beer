name: Configure one Pint Path runtime variable
run-name: Configure runtime variable | ${{ inputs.target }} | ${{ inputs.variable_name }} | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      target:
        description: Exact protected Railway environment
        required: true
        type: choice
        options:
          - permanent-staging
          - permanent-staging-postgres
          - production
      variable_name:
        description: Exact reviewed runtime variable
        required: true
        type: choice
        options:
          - DATABASE_URL
          - DATABASE_MAINTENANCE_URL
          - PINTPATH_POSTGRES_ROOT_CA_PEM
          - PINTPATH_POSTGRES_ROOT_CA_DER_SHA256
          - GOOGLE_MAPS_API_KEY
          - GOOGLE_MAPS_MAP_ID
          - GOOGLE_PLACES_API_KEY
          - OPENAI_API_KEY
          - SUPABASE_URL
          - SUPABASE_ANON_KEY
          - SUPABASE_SERVICE_ROLE_KEY
          - REDIS_URL
          - RESEND_TRANSACTIONAL_API_KEY
          - RESEND_WEBHOOK_SIGNING_SECRET
          - SOURCE_EVIDENCE_SIGNING_SECRET
          - ACCOUNT_DELETION_NOTICE_ACTIVE_KEY_ID
          - ACCOUNT_DELETION_NOTICE_FROM
          - ACCOUNT_DELETION_NOTICE_KEYRING_JSON
          - ACCOUNT_DELETION_NOTICE_REPLY_TO
          - PINTPATH_RUNTIME_DATABASE_URL
      confirmation:
        description: UPSERT_<VARIABLE>_IN_<TARGET_WITH_UNDERSCORES>
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ inputs.target != 'production' && 'pintpath-permanent-staging-key-rollout' || format('pintpath-runtime-variable-{0}-{1}', inputs.target, inputs.variable_name) }}
  queue: max
  cancel-in-progress: false

jobs:
  reject-invalid-service-variable-pair:
    if: (inputs.target == 'permanent-staging-postgres' && inputs.variable_name != 'PINTPATH_RUNTIME_DATABASE_URL') || (inputs.target != 'permanent-staging-postgres' && inputs.variable_name == 'PINTPATH_RUNTIME_DATABASE_URL')
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a variable outside its one reviewed service target
        shell: bash
        run: |
          echo 'PINTPATH_RUNTIME_DATABASE_URL is fixed to the permanent-staging PostgreSQL service; all other variables target the Beer application service.' >&2
          exit 1

  reject-permanent-staging-supabase-key-bypass:
    if: inputs.target == 'permanent-staging' && (inputs.variable_name == 'SUPABASE_ANON_KEY' || inputs.variable_name == 'SUPABASE_SERVICE_ROLE_KEY')
    runs-on: ubuntu-24.04
    steps:
      - name: Require the atomic paired replacement workflow
        shell: bash
        run: |
          echo 'Permanent-staging Supabase keys require the protected atomic paired replacement workflow.' >&2
          exit 1

  configure-staging:
    if: ((inputs.target == 'permanent-staging' && inputs.variable_name != 'PINTPATH_RUNTIME_DATABASE_URL') || (inputs.target == 'permanent-staging-postgres' && inputs.variable_name == 'PINTPATH_RUNTIME_DATABASE_URL')) && inputs.variable_name != 'SUPABASE_ANON_KEY' && inputs.variable_name != 'SUPABASE_SERVICE_ROLE_KEY'
    name: Configure permanent staging
    uses: ./.github/workflows/runtime-variable-worker.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      target: ${{ inputs.target }}
      variable_name: ${{ inputs.variable_name }}
      confirmation: ${{ inputs.confirmation }}
      protected_environment: permanent-staging-provider-mutation
      value_secret_name: ${{ inputs.target == 'permanent-staging-postgres' && 'PINTPATH_REVIEWED_FIXED_POSTGRES_RUNTIME_URL' || format('PINTPATH_STAGING_{0}', inputs.variable_name) }}
    secrets: inherit

  configure-production:
    if: inputs.target == 'production' && inputs.variable_name != 'PINTPATH_RUNTIME_DATABASE_URL'
    name: Configure production
    uses: ./.github/workflows/runtime-variable-worker.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      target: production
      variable_name: ${{ inputs.variable_name }}
      confirmation: ${{ inputs.confirmation }}
      protected_environment: production-runtime-configuration
      value_secret_name: ${{ format('PINTPATH_PRODUCTION_{0}', inputs.variable_name) }}
    secrets: inherit
