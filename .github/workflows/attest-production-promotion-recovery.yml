name: Attest Pint Path protected production promotion recovery

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current 40-character main SHA promoted while ingress was closed
        required: true
        type: string
      evidence_run_id:
        description: Run ID containing the twice-reviewed hash-pinned input artifact
        required: true
        type: string
      confirmation:
        description: Type ATTEST_PRODUCTION_PROMOTION_RECOVERY
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: pintpath-production-rollout
  cancel-in-progress: false

jobs:
  attest-promotion-recovery:
    name: Attest protected production promotion and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-promotion-recovery
    steps:
      - name: Checkout the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require exact current main and one-shot protected authority
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$CONFIRMATION" = 'ATTEST_PRODUCTION_PROMOTION_RECOVERY'
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$RUN_ATTEMPT" = '1'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Run the promotion-recovery implementation contract
        run: npm run production:promotion-recovery:contract:check

      - name: Require the exact deploy-scale-close GitHub chain
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pintpath-production-promotion-recovery-github"
          npm run --silent github:release-candidate:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --phase promotion-recovery \
            --output "$RUNNER_TEMP/pintpath-production-promotion-recovery-github/required-chain.json"
          chmod 600 "$RUNNER_TEMP/pintpath-production-promotion-recovery-github/required-chain.json"

      - name: Create private evidence custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pintpath-production-promotion-recovery-input"
          mkdir -m 700 "$RUNNER_TEMP/pintpath-production-promotion-recovery-output"

      - name: Download the exact named reviewed input artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          name: pintpath-production-promotion-recovery-input-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-production-promotion-recovery-input

      - name: Require the exact secret-free evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pintpath-production-promotion-recovery-input"
          test "$(find "$input" -mindepth 1 -type l -print -quit)" = ''
          mapfile -t observed < <(find "$input" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(
            apply-authorization-receipt.json apply-operation-receipt.json
            approval-one.json approval-two.json authority.json
            closed-route-terminal.json
            deletion-replay-first-receipt.json deletion-replay-second-receipt.json
            logical-backup-manifest.json logical-offsite-result.json
            logical-restore-receipt.json logical-worm-result.json
            offsite-retrieval-receipt.json pitr-receipt.json
            private-storage-capture-receipt.json
            private-storage-recovery-manifest.json
            private-storage-restore-receipt.json
          )
          test "${#observed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${observed[$index]}" = "${expected[$index]}"
          done
          test "$(find "$input" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ''
          chmod 600 "$input"/*

      - name: Materialize the two independently protected reviewer public keys
        env:
          REVIEWER_ONE_PUBLIC_KEY_BASE64: ${{ secrets.PINTPATH_PROMOTION_RECOVERY_REVIEWER_ONE_PUBLIC_KEY_BASE64 }}
          REVIEWER_TWO_PUBLIC_KEY_BASE64: ${{ secrets.PINTPATH_PROMOTION_RECOVERY_REVIEWER_TWO_PUBLIC_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          input="$RUNNER_TEMP/pintpath-production-promotion-recovery-input"
          printf '%s' "$REVIEWER_ONE_PUBLIC_KEY_BASE64" | base64 --decode > "$input/reviewer-one.pem"
          printf '%s' "$REVIEWER_TWO_PUBLIC_KEY_BASE64" | base64 --decode > "$input/reviewer-two.pem"
          chmod 600 "$input/reviewer-one.pem" "$input/reviewer-two.pem"

      - name: Materialize exact GitHub deploy, scale, and route-close receipts
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pintpath-production-promotion-recovery-input"
          chain="$RUNNER_TEMP/pintpath-production-promotion-recovery-github/required-chain.json"
          npm run --silent github:production-promotion-recovery:materialize -- \
            --authority "$chain" --candidate-sha "$CANDIDATE_SHA" \
            --stage deploy --output "$input/production-deployment-receipt.json"
          npm run --silent github:production-promotion-recovery:materialize -- \
            --authority "$chain" --candidate-sha "$CANDIDATE_SHA" \
            --stage scale --output "$input/production-scale-receipt.json"
          npm run --silent github:production-promotion-recovery:materialize -- \
            --authority "$chain" --candidate-sha "$CANDIDATE_SHA" \
            --stage close --output "$input/closed-route-receipt.json"
          chmod 600 "$input/production-deployment-receipt.json" \
            "$input/production-scale-receipt.json" "$input/closed-route-receipt.json"

      - name: Cryptographically attest the exact promotion and recovery chain
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_PRODUCTION_PROMOTION_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
          REVIEWER_ONE_PUBLIC_KEY_SHA256: ${{ vars.PINTPATH_PROMOTION_RECOVERY_REVIEWER_ONE_PUBLIC_KEY_SHA256 }}
          REVIEWER_TWO_PUBLIC_KEY_SHA256: ${{ vars.PINTPATH_PROMOTION_RECOVERY_REVIEWER_TWO_PUBLIC_KEY_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          input="$RUNNER_TEMP/pintpath-production-promotion-recovery-input"
          output="$RUNNER_TEMP/pintpath-production-promotion-recovery-output"
          authority_sha256="$(sha256sum "$input/authority.json" | cut -d ' ' -f 1)"
          npm run --silent production:promotion-recovery:attest -- \
            --authority "$input/authority.json" \
            --authority-sha256 "$authority_sha256" \
            --production-deployment-receipt "$input/production-deployment-receipt.json" \
            --production-scale-receipt "$input/production-scale-receipt.json" \
            --closed-route-receipt "$input/closed-route-receipt.json" \
            --closed-route-terminal "$input/closed-route-terminal.json" \
            --apply-authorization-receipt "$input/apply-authorization-receipt.json" \
            --apply-operation-receipt "$input/apply-operation-receipt.json" \
            --pitr-receipt "$input/pitr-receipt.json" \
            --logical-backup-manifest "$input/logical-backup-manifest.json" \
            --logical-offsite-result "$input/logical-offsite-result.json" \
            --logical-worm-result "$input/logical-worm-result.json" \
            --private-storage-capture-receipt "$input/private-storage-capture-receipt.json" \
            --private-storage-recovery-manifest "$input/private-storage-recovery-manifest.json" \
            --offsite-retrieval-receipt "$input/offsite-retrieval-receipt.json" \
            --logical-restore-receipt "$input/logical-restore-receipt.json" \
            --private-storage-restore-receipt "$input/private-storage-restore-receipt.json" \
            --deletion-replay-first-receipt "$input/deletion-replay-first-receipt.json" \
            --deletion-replay-second-receipt "$input/deletion-replay-second-receipt.json" \
            --approval-one "$input/approval-one.json" \
            --approval-one-public-key "$input/reviewer-one.pem" \
            --approval-two "$input/approval-two.json" \
            --approval-two-public-key "$input/reviewer-two.pem" \
            --expected-reviewer-one-public-key-sha256 "$REVIEWER_ONE_PUBLIC_KEY_SHA256" \
            --expected-reviewer-two-public-key-sha256 "$REVIEWER_TWO_PUBLIC_KEY_SHA256" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$output/production-promotion-recovery-receipt.json" \
            > "$output/attestation-result.json"
          chmod 600 "$output/attestation-result.json"

      - name: Bind the trusted artifact to the tested commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pintpath-production-promotion-recovery-output"
          printf '%s\n' "$CANDIDATE_SHA" > "$output/tested-commit-sha.txt"
          chmod 600 "$output/tested-commit-sha.txt"

      - name: Upload the trusted promotion-recovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-promotion-recovery-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/pintpath-production-promotion-recovery-output/production-promotion-recovery-receipt.json
            ${{ runner.temp }}/pintpath-production-promotion-recovery-output/attestation-result.json
            ${{ runner.temp }}/pintpath-production-promotion-recovery-output/tested-commit-sha.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove private input custody
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pintpath-production-promotion-recovery-input"
          if [ -d "$input" ] && [ ! -L "$input" ]; then
            find "$input" -depth -mindepth 1 -delete
            rmdir "$input"
          fi
          github="$RUNNER_TEMP/pintpath-production-promotion-recovery-github"
          if [ -d "$github" ] && [ ! -L "$github" ]; then
            find "$github" -depth -mindepth 1 -delete
            rmdir "$github"
          fi
