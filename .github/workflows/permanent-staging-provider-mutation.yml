name: Mutate Pint Path permanent-staging provider variables
run-name: Permanent staging provider mutation | ${{ inputs.operation }} | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      operation:
        description: One reviewed permanent-staging variable operation
        required: true
        type: choice
        options:
          - provider-google-maps-api-key
          - provider-google-maps-map-id
          - provider-google-places-api-key
          - provider-openai-api-key
          - supabase-key-replacement
          - remove-forbidden-offsite-backup-variables
          - resume-forbidden-offsite-backup-deletion-patch
          - cancel-forbidden-offsite-backup-deletion-patch
          - cancel-masked-forbidden-offsite-backup-deletion-patch
      prior_cleanup_run_id:
        description: Exact failed cleanup run selected by the reviewed recovery operation
        required: false
        type: string
      confirmation:
        description: MUTATE_<UPPERCASE_OPERATION>_IN_PERMANENT_STAGING
        required: true
        type: string
      external_mutation_freeze_attestation:
        description: Type I_ATTEST_EXTERNAL_RAILWAY_MUTATIONS_ARE_FROZEN_FOR_THIS_RUN after freezing Railway dashboard/API/autodeploy and all staging writers, including the separate Postgres build-canary workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-permanent-staging-key-rollout
  queue: max
  cancel-in-progress: false

jobs:
  mutate:
    name: One protected variable mutation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: permanent-staging-provider-mutation

    steps:
      - name: Checkout the exact main candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require an original run at the exact current main candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OPERATION: ${{ inputs.operation }}
          PRIOR_CLEANUP_RUN_ID: ${{ inputs.prior_cleanup_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$RUN_ATTEMPT" = '1'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          expected="MUTATE_${OPERATION^^}_IN_PERMANENT_STAGING"
          expected="${expected//-/_}"
          test "$CONFIRMATION" = "$expected"
          test "$EXTERNAL_MUTATION_FREEZE_ATTESTATION" = \
            'I_ATTEST_EXTERNAL_RAILWAY_MUTATIONS_ARE_FROZEN_FOR_THIS_RUN'
          case "$OPERATION" in
            resume-forbidden-offsite-backup-deletion-patch|cancel-forbidden-offsite-backup-deletion-patch)
              [[ "$PRIOR_CLEANUP_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              ;;
            cancel-masked-forbidden-offsite-backup-deletion-patch)
              test "$PRIOR_CLEANUP_RUN_ID" = '33164687424'
              ;;
            *) test -z "$PRIOR_CLEANUP_RUN_ID" ;;
          esac

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Verify the repository before exposing protected credentials
        run: npm run check

      - name: Create private input and evidence custody directories
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pintpath-provider-input"
          mkdir -m 700 "$RUNNER_TEMP/pintpath-provider-evidence"
          jq -n --arg candidateSha "$CANDIDATE_SHA" --arg operation "$OPERATION" \
            '{schemaVersion:"pintpath-provider-mutation-dispatch/v1",candidateSha:$candidateSha,operation:$operation,secretMaterialIncluded:false}' \
            > "$RUNNER_TEMP/pintpath-provider-evidence/dispatch.json"
          chmod 600 "$RUNNER_TEMP/pintpath-provider-evidence/dispatch.json"

      - name: Authenticate the reviewed candidate and fresh operation dispatch
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PRIOR_CLEANUP_RUN_ID: ${{ inputs.prior_cleanup_run_id }}
        run: |
          authority_args=(
            --candidate-sha "$CANDIDATE_SHA"
            --operation "$OPERATION"
          )
          if [[ "$OPERATION" =~ ^(resume|cancel)-forbidden-offsite-backup-deletion-patch$ ]] \
            || test "$OPERATION" = 'cancel-masked-forbidden-offsite-backup-deletion-patch'; then
            authority_args+=(--prior-run-id "$PRIOR_CLEANUP_RUN_ID")
          fi
          npm run --silent github:reviewed-candidate-authority:verify -- \
            "${authority_args[@]}" \
            > "$RUNNER_TEMP/pintpath-provider-input/reviewed-authority.json"
          chmod 600 "$RUNNER_TEMP/pintpath-provider-input/reviewed-authority.json"

      - name: Attempt to download retained prior cleanup evidence
        id: prior_cleanup_evidence
        if: inputs.operation == 'resume-forbidden-offsite-backup-deletion-patch' || inputs.operation == 'cancel-forbidden-offsite-backup-deletion-patch'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prior_cleanup_run_id }}
          name: pintpath-permanent-staging-provider-mutation-remove-forbidden-offsite-backup-variables-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-provider-input/prior-offsite-cleanup-evidence

      - name: Seal the downloaded prior cleanup evidence as read-only input
        if: steps.prior_cleanup_evidence.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pintpath-provider-input/prior-offsite-cleanup-evidence"
          test -d "$evidence"
          test ! -L "$evidence"
          find "$evidence" -mindepth 1 -maxdepth 1 -type f | grep -q .
          test -z "$(find "$evidence" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          chmod 700 "$evidence"
          find "$evidence" -type f -exec chmod 600 -- {} +

      - name: Download the exact retained incident cleanup evidence
        id: incident_prior_cleanup_evidence
        if: inputs.operation == 'cancel-masked-forbidden-offsite-backup-deletion-patch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 33164687424
          name: pintpath-permanent-staging-provider-mutation-remove-forbidden-offsite-backup-variables-ac7130e0306802825922d21a4c61135b84edd43b
          path: ${{ runner.temp }}/pintpath-provider-input/incident-prior-offsite-cleanup-evidence

      - name: Seal the exact incident cleanup evidence as read-only input
        if: inputs.operation == 'cancel-masked-forbidden-offsite-backup-deletion-patch'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pintpath-provider-input/incident-prior-offsite-cleanup-evidence"
          test -d "$evidence"
          test ! -L "$evidence"
          test -z "$(find "$evidence" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          for leaf in dispatch.json intent.json terminal.json; do
            test -f "$evidence/$leaf"
            test ! -L "$evidence/$leaf"
          done
          test -z "$(find "$evidence" -mindepth 1 -maxdepth 1 -type f \
            ! -name dispatch.json ! -name intent.json ! -name terminal.json \
            -print -quit)"
          chmod 700 "$evidence"
          find "$evidence" -type f -exec chmod 600 -- {} +

      - name: Verify replacement-key consumer compatibility
        if: inputs.operation == 'supabase-key-replacement'
        run: npm run supabase:keys:consumer-compatibility:check

      - name: Stage Google Maps API key in private custody
        if: inputs.operation == 'provider-google-maps-api-key'
        env:
          PROVIDER_VALUE: ${{ secrets.PINTPATH_STAGING_GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVIDER_VALUE"
          umask 077
          printf '%s' "$PROVIDER_VALUE" > "$RUNNER_TEMP/pintpath-provider-input/value"

      - name: Stage Google Maps map ID in private custody
        if: inputs.operation == 'provider-google-maps-map-id'
        env:
          PROVIDER_VALUE: ${{ secrets.PINTPATH_STAGING_GOOGLE_MAPS_MAP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVIDER_VALUE"
          umask 077
          printf '%s' "$PROVIDER_VALUE" > "$RUNNER_TEMP/pintpath-provider-input/value"

      - name: Stage Google Places API key in private custody
        if: inputs.operation == 'provider-google-places-api-key'
        env:
          PROVIDER_VALUE: ${{ secrets.PINTPATH_STAGING_GOOGLE_PLACES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVIDER_VALUE"
          umask 077
          printf '%s' "$PROVIDER_VALUE" > "$RUNNER_TEMP/pintpath-provider-input/value"

      - name: Stage OpenAI API key in private custody
        if: inputs.operation == 'provider-openai-api-key'
        env:
          PROVIDER_VALUE: ${{ secrets.PINTPATH_STAGING_OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVIDER_VALUE"
          umask 077
          printf '%s' "$PROVIDER_VALUE" > "$RUNNER_TEMP/pintpath-provider-input/value"

      - name: Stage the paired Supabase replacement keys in private custody
        if: inputs.operation == 'supabase-key-replacement'
        env:
          PUBLISHABLE_KEY: ${{ secrets.PINTPATH_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_KEY: ${{ secrets.PINTPATH_STAGING_SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,220}$ ]]
          [[ "$SECRET_KEY" =~ ^sb_secret_[A-Za-z0-9_-]{20,220}$ ]]
          test "$PUBLISHABLE_KEY" != "$SECRET_KEY"
          umask 077
          printf '%s' "$PUBLISHABLE_KEY" > "$RUNNER_TEMP/pintpath-provider-input/publishable"
          printf '%s' "$SECRET_KEY" > "$RUNNER_TEMP/pintpath-provider-input/secret"

      - name: Reassert exact current main immediately before the variable mutation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Execute one reviewed protected Railway mutation plan
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_MUTATION_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
          PINTPATH_PRIOR_CLEANUP_RUN_ID: ${{ inputs.prior_cleanup_run_id }}
          PINTPATH_PRIOR_CLEANUP_EVIDENCE_OUTCOME: ${{ steps.prior_cleanup_evidence.outcome }}
          PINTPATH_INCIDENT_PRIOR_CLEANUP_EVIDENCE_OUTCOME: ${{ steps.incident_prior_cleanup_evidence.outcome }}
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_MUTATION_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_VARIABLE_MUTATION_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --operation "$OPERATION"
            --evidence-dir "$RUNNER_TEMP/pintpath-provider-evidence"
          )
          if test "$OPERATION" = 'supabase-key-replacement'; then
            ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-variable-mutation.ts \
              "${common[@]}" \
              --publishable-key-file "$RUNNER_TEMP/pintpath-provider-input/publishable" \
              --secret-key-file "$RUNNER_TEMP/pintpath-provider-input/secret"
          elif test "$OPERATION" = 'remove-forbidden-offsite-backup-variables'; then
            ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-variable-mutation.ts \
              "${common[@]}"
          elif test "$OPERATION" = 'cancel-masked-forbidden-offsite-backup-deletion-patch'; then
            test "$PINTPATH_INCIDENT_PRIOR_CLEANUP_EVIDENCE_OUTCOME" = 'success'
            ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-variable-mutation.ts \
              "${common[@]}" \
              --prior-cleanup-run-id "$PINTPATH_PRIOR_CLEANUP_RUN_ID" \
              --prior-cleanup-evidence-dir "$RUNNER_TEMP/pintpath-provider-input/incident-prior-offsite-cleanup-evidence" \
              --reviewed-authority-file "$RUNNER_TEMP/pintpath-provider-input/reviewed-authority.json"
          elif [[ "$OPERATION" =~ ^(resume|cancel)-forbidden-offsite-backup-deletion-patch$ ]]; then
            recovery=(
              --prior-cleanup-run-id "$PINTPATH_PRIOR_CLEANUP_RUN_ID"
              --reviewed-authority-file "$RUNNER_TEMP/pintpath-provider-input/reviewed-authority.json"
            )
            if test "$PINTPATH_PRIOR_CLEANUP_EVIDENCE_OUTCOME" = 'success'; then
              recovery+=(
                --prior-cleanup-evidence-dir "$RUNNER_TEMP/pintpath-provider-input/prior-offsite-cleanup-evidence"
              )
            fi
            ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-variable-mutation.ts \
              "${common[@]}" \
              "${recovery[@]}"
          else
            ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-variable-mutation.ts \
              "${common[@]}" \
              --value-file "$RUNNER_TEMP/pintpath-provider-input/value"
          fi

      - name: Remove private input custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/pintpath-provider-input"
          if test -d "$input_root"; then
            find "$input_root" -type f -exec shred -u -- {} + 2>/dev/null \
              || find "$input_root" -type f -exec rm -f -- {} +
            find "$input_root" -depth -type d -exec rmdir -- {} +
          fi
          test ! -e "$input_root"

      - name: Reconcile the Railway mutation boundary after every attempt
        if: always()
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        run: npm run readiness:railway:mutation-boundary

      - name: Upload secret-free terminal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-permanent-staging-provider-mutation-${{ inputs.operation }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-provider-evidence/
          if-no-files-found: error
          retention-days: 30
