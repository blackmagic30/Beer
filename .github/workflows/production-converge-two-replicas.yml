name: Converge Pint Path production to two replicas
run-name: Converge production to two replicas | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main SHA authorizing this operation
        required: true
        type: string
      confirmation:
        description: CONVERGE_PRODUCTION_TO_TWO_REPLICAS
        required: true
        type: string
      activate_run_id:
        description: Exact successful production automatic-maintenance activation run ID
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-production-rollout
  cancel-in-progress: false

jobs:
  converge-two:
    name: Converge exact production deployment to two replicas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-topology-configuration
    steps:
      - name: Checkout the exact main candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require exact authority and explicit production confirmation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTIVATE_RUN_ID: ${{ inputs.activate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ACTIVATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$RUN_ATTEMPT" = '1'
          test "$CONFIRMATION" = 'CONVERGE_PRODUCTION_TO_TWO_REPLICAS'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Create private evidence custody
        shell: bash
        run: mkdir -m 700 "$RUNNER_TEMP/pintpath-production-scale-evidence"

      - name: Download the exact production worker-activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pintpath-automatic-maintenance-worker-fence-production-activate-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-production-worker-activation-prerequisite
          github-token: ${{ github.token }}
          run-id: ${{ inputs.activate_run_id }}

      - name: Seal and verify the exact production worker activation
        env:
          ACTIVATE_RUN_ID: ${{ inputs.activate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_ACTIONS: "true"
          GITHUB_API_URL: https://api.github.com
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          PINTPATH_PRODUCTION_SCALE_ACTIVATE_RUN_ID: ${{ inputs.activate_run_id }}
          PINTPATH_PRODUCTION_SCALE_GITHUB_ENVIRONMENT: production-topology-configuration
          PINTPATH_SCALE_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          prerequisite_root="$RUNNER_TEMP/pintpath-production-worker-activation-prerequisite"
          terminal="$prerequisite_root/automatic-maintenance-worker-fence-terminal.json"
          activation_prerequisites="$prerequisite_root/production-activation-role-limit-verification.json"
          test -d "$prerequisite_root"
          test ! -L "$prerequisite_root"
          test -f "$terminal"
          test -f "$activation_prerequisites"
          test ! -L "$terminal"
          test ! -L "$activation_prerequisites"
          test "$(find "$prerequisite_root" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = '2'
          chmod 600 "$terminal" "$activation_prerequisites"
          ./node_modules/.bin/tsx scripts/verify-production-maintenance-role-limit-prerequisites.ts \
            --mode production-scale \
            --candidate-sha "$CANDIDATE_SHA" \
            --activate-run-id "$ACTIVATE_RUN_ID" \
            --activate-terminal-file "$terminal" \
            --activation-prerequisites-file "$activation_prerequisites" \
            --output "$RUNNER_TEMP/pintpath-production-scale-evidence/production-scale-activation-verification.json"

      - name: Install the exact reviewed Railway CLI archive
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/pintpath-production-scale-cli"
          cli_archive="$cli_root/railway-5.32.0-x86_64-linux.tar.gz"
          mkdir -m 700 "$cli_root"
          curl --fail --silent --show-error --location \
            'https://github.com/railwayapp/cli/releases/download/v5.32.0/railway-v5.32.0-x86_64-unknown-linux-musl.tar.gz' \
            --output "$cli_archive"
          echo 'cd69b2ecb556601751165d85ac31a5fbc38cff46397939356df28d2b96a005f5  '"$cli_archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$cli_archive" --directory "$cli_root" \
            --no-same-owner --no-same-permissions
          cli_path="$cli_root/railway"
          echo '27133cfc20bffc43b2f32c1638fa3c50eefc2f9d2d80301a93de34632ccb7a43  '"$cli_path" \
            | sha256sum --check --strict
          chmod 500 "$cli_path"
          test "$("$cli_path" --version)" = 'railway 5.32.0'
          echo "PINTPATH_RAILWAY_CLI_PATH=$cli_path" >> "$GITHUB_ENV"

      - name: Verify the complete repository before the provider write
        run: npm run check

      - name: Reassert exact current main immediately before the provider write
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Converge the exact production deployment to two replicas once
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_SCALE_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_PRODUCTION_SCALE_ACTIVATE_RUN_ID: ${{ inputs.activate_run_id }}
          PINTPATH_PRODUCTION_SCALE_ACTIVATION_VERIFICATION_FILE: ${{ runner.temp }}/pintpath-production-scale-evidence/production-scale-activation-verification.json
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_PRODUCTION_SCALE_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_SCALE_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/execute-protected-permanent-staging-scale.ts \
            --direction converge-production-two \
            --candidate-sha "$CANDIDATE_SHA" \
            --expected-deployment-sha "$CANDIDATE_SHA" \
            --evidence-dir "$RUNNER_TEMP/pintpath-production-scale-evidence" \
            --production-activation-run-id "$PINTPATH_PRODUCTION_SCALE_ACTIVATE_RUN_ID" \
            --production-scale-verification-file "$PINTPATH_PRODUCTION_SCALE_ACTIVATION_VERIFICATION_FILE"

      - name: Reconcile the Railway mutation boundary after every attempt
        if: always()
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        run: npm run readiness:railway:mutation-boundary

      - name: Upload secret-free production scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-scale-evidence-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-production-scale-evidence
          if-no-files-found: error
          retention-days: 30
