name: Lock protected production Postgres source
run-name: Production Postgres source lock | ${{ inputs.operation_mode }} | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed 40-character SHA currently at main
        required: true
        type: string
      operation_mode:
        description: Apply once from the armed baseline, or reconcile one prior ambiguous apply
        required: true
        type: choice
        options:
          - apply
          - reconcile
      prior_run_id:
        description: Reconcile only; prior ambiguous apply run containing the durable intent artifact
        required: false
        type: string
      prior_candidate_sha:
        description: Reconcile only; exact 40-character candidate SHA bound to the prior intent and run
        required: false
        type: string
      confirmation:
        description: LOCK_PRODUCTION_POSTGRES_SOURCE_AND_DISABLE_AUTO_UPDATES_WITHOUT_DEPLOY
        required: true
        type: string
      external_mutation_freeze_attestation:
        description: I_ATTEST_EXTERNAL_RAILWAY_MUTATIONS_ARE_FROZEN_FOR_THIS_RUN
        required: true
        type: string
      prior_run_grace_attestation:
        description: Reconcile only; I_ATTEST_PRIOR_SOURCE_LOCK_RUN_ENDED_AND_NO_WRITER_IS_ACTIVE
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-production-rollout
  queue: max
  cancel-in-progress: false

jobs:
  source-lock:
    name: Lock or reconcile the protected production Postgres source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-postgres-source-repin

    steps:
      - name: Checkout the exact current main candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require an original exact-main source-lock dispatch
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
          OPERATION_MODE: ${{ inputs.operation_mode }}
          PRIOR_CANDIDATE_SHA: ${{ inputs.prior_candidate_sha }}
          PRIOR_RUN_GRACE_ATTESTATION: ${{ inputs.prior_run_grace_attestation }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$CONFIRMATION" = LOCK_PRODUCTION_POSTGRES_SOURCE_AND_DISABLE_AUTO_UPDATES_WITHOUT_DEPLOY
          test "$EXTERNAL_MUTATION_FREEZE_ATTESTATION" = I_ATTEST_EXTERNAL_RAILWAY_MUTATIONS_ARE_FROZEN_FOR_THIS_RUN
          test "$DISPATCH_REF" = refs/heads/main
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$RUN_ATTEMPT" = 1
          case "$OPERATION_MODE" in
            apply)
              test -z "$PRIOR_CANDIDATE_SHA"
              test -z "$PRIOR_RUN_ID"
              test -z "$PRIOR_RUN_GRACE_ATTESTATION"
              ;;
            reconcile)
              [[ "$PRIOR_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
              [[ "$PRIOR_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              test "$PRIOR_RUN_ID" != "$RUN_ID"
              test "$PRIOR_RUN_GRACE_ATTESTATION" = I_ATTEST_PRIOR_SOURCE_LOCK_RUN_ENDED_AND_NO_WRITER_IS_ACTIVE
              ;;
            *)
              exit 1
              ;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Run the complete repository gate before protected credentials are exposed
        env:
          NODE_ENV: test
          PUBLIC_BASE_URL: http://localhost:3000
          DATABASE_PATH: ./data/ci-production-postgres-source-lock.sqlite
          OUTBOUND_CALLS_ENABLED: false
        run: npm run check

      - name: Create private source-lock evidence custody
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          OPERATION_MODE: ${{ inputs.operation_mode }}
          PRIOR_CANDIDATE_SHA: ${{ inputs.prior_candidate_sha }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence"
          intent="$RUNNER_TEMP/pintpath-production-postgres-source-lock-intent"
          mkdir -m 700 "$evidence" "$intent"
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg operationMode "$OPERATION_MODE" \
            --arg priorCandidateSha "$PRIOR_CANDIDATE_SHA" \
            --arg priorRunId "$PRIOR_RUN_ID" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{schemaVersion:"pintpath-production-postgres-source-lock-dispatch/v2",candidateSha:$candidateSha,operationMode:$operationMode,priorCandidateSha:($priorCandidateSha | if length == 0 then null else . end),priorRunId:($priorRunId | if length == 0 then null else . end),workflowRunId:$workflowRunId,secretMaterialIncluded:false}' \
            > "$evidence/dispatch.json"
          chmod 600 "$evidence/dispatch.json"

      - name: Verify reviewed-candidate authority before any mutation credential exists
        id: reviewed_authority
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION_MODE: ${{ inputs.operation_mode }}
          PRIOR_CANDIDATE_SHA: ${{ inputs.prior_candidate_sha }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          authority="$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence/reviewed-authority.json"
          command=(
            npm run --silent github:reviewed-candidate-authority:verify --
            --candidate-sha "$CANDIDATE_SHA"
          )
          if [[ "$OPERATION_MODE" = apply ]]; then
            command+=(--operation production-postgres-source-repin)
          else
            command+=(
              --operation production-postgres-source-repin-reconcile
              --prior-candidate-sha "$PRIOR_CANDIDATE_SHA"
              --prior-run-id "$PRIOR_RUN_ID"
            )
          fi
          "${command[@]}" > "$authority"
          chmod 600 "$authority"
          test -s "$authority"

      - name: Prepare the exact source-lock intent with metadata credentials only
        if: inputs.operation_mode == 'apply'
        env:
          PINTPATH_EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_REPIN_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent railway:production:postgres-source-repin:protected -- \
            --phase prepare \
            --candidate-sha '${{ inputs.candidate_sha }}' \
            --github-authority "$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence/reviewed-authority.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence"

      - name: Persist the exact source-lock intent before any mutation credential exists
        id: persist_intent
        if: inputs.operation_mode == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-postgres-source-lock-intent-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pintpath-production-postgres-source-lock-evidence/source-lock-intent.json
          if-no-files-found: error
          retention-days: 30

      - name: Retrieve the exact prior source-lock intent for reconciliation
        if: inputs.operation_mode == 'reconcile'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prior_run_id }}
          name: pintpath-production-postgres-source-lock-intent-${{ inputs.prior_candidate_sha }}-${{ inputs.prior_run_id }}
          path: ${{ runner.temp }}/pintpath-production-postgres-source-lock-intent

      - name: Retrieve the exact cross-candidate incident terminal evidence
        if: inputs.operation_mode == 'reconcile' && inputs.prior_candidate_sha != inputs.candidate_sha
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prior_run_id }}
          name: pintpath-production-postgres-source-lock-apply-${{ inputs.prior_candidate_sha }}-${{ inputs.prior_run_id }}
          path: ${{ runner.temp }}/pintpath-production-postgres-source-lock-prior-terminal

      - name: Bind the exact durable intent artifact before the writer
        id: intent_binding
        env:
          APPLY_ARTIFACT_DIGEST: ${{ steps.persist_intent.outputs.artifact-digest }}
          APPLY_ARTIFACT_ID: ${{ steps.persist_intent.outputs.artifact-id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION_MODE: ${{ inputs.operation_mode }}
          PRIOR_CANDIDATE_SHA: ${{ inputs.prior_candidate_sha }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION_MODE" = apply ]]; then
            artifact_id="$APPLY_ARTIFACT_ID"
            [[ "$APPLY_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
            artifact_digest="sha256:$APPLY_ARTIFACT_DIGEST"
            artifact_name="pintpath-production-postgres-source-lock-intent-$CANDIDATE_SHA-$GITHUB_RUN_ID"
            artifact_run_id="$GITHUB_RUN_ID"
            intent="$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence/source-lock-intent.json"
          else
            artifact_name="pintpath-production-postgres-source-lock-intent-$PRIOR_CANDIDATE_SHA-$PRIOR_RUN_ID"
            artifact_run_id="$PRIOR_RUN_ID"
            intent="$RUNNER_TEMP/pintpath-production-postgres-source-lock-intent/source-lock-intent.json"
            response="$RUNNER_TEMP/pintpath-production-postgres-source-lock-artifact.json"
            umask 077
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$response" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID/artifacts?name=$artifact_name&per_page=100"
            jq -e \
              --arg candidate "$PRIOR_CANDIDATE_SHA" \
              --arg name "$artifact_name" \
              --argjson priorRunId "$PRIOR_RUN_ID" \
              '.total_count == 1 and (.artifacts | length) == 1 and .artifacts[0].name == $name and .artifacts[0].expired == false and .artifacts[0].workflow_run.id == $priorRunId and .artifacts[0].workflow_run.head_branch == "main" and .artifacts[0].workflow_run.head_sha == $candidate and (.artifacts[0].id | type) == "number" and (.artifacts[0].digest | type) == "string"' \
              "$response" >/dev/null
            artifact_id="$(jq -r '.artifacts[0].id' "$response")"
            artifact_digest="$(jq -r '.artifacts[0].digest' "$response")"
          fi
          [[ "$artifact_id" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$artifact_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -f "$intent"
          test ! -L "$intent"
          test "$(find "$(dirname "$intent")" -mindepth 1 -maxdepth 1 -type f -name source-lock-intent.json | wc -l | tr -d ' ')" = 1
          chmod 600 "$intent"
          intent_sha256="$(sha256sum "$intent" | awk '{print $1}')"
          [[ "$intent_sha256" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$OPERATION_MODE" = reconcile && "$PRIOR_CANDIDATE_SHA" != "$CANDIDATE_SHA" ]]; then
            test "$PRIOR_CANDIDATE_SHA" = 52049a1ef414e274e47197e28726387c90d96990
            test "$PRIOR_RUN_ID" = 33923801697
            test "$artifact_id" = 9956146300
            test "$artifact_digest" = sha256:03f39ec4e154809d7f778067fed83ba908af4a30e4b17a5a70809c1bbe6654f3
            test "$intent_sha256" = 61381d0ea3fd5394bb4de33b63379fcd13f524614797a434ff2b3e13f862bf9c
          fi
          {
            printf 'artifact_id=%s\n' "$artifact_id"
            printf 'artifact_digest=%s\n' "$artifact_digest"
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'artifact_run_id=%s\n' "$artifact_run_id"
            printf 'intent_file=%s\n' "$intent"
            printf 'intent_sha256=%s\n' "$intent_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Bind the exact cross-candidate incident terminal evidence before the writer
        id: prior_terminal_binding
        if: inputs.operation_mode == 'reconcile' && inputs.prior_candidate_sha != inputs.candidate_sha
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIOR_CANDIDATE_SHA: ${{ inputs.prior_candidate_sha }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PRIOR_CANDIDATE_SHA" = 52049a1ef414e274e47197e28726387c90d96990
          test "$PRIOR_CANDIDATE_SHA" != "$CANDIDATE_SHA"
          test "$PRIOR_RUN_ID" = 33923801697
          artifact_name="pintpath-production-postgres-source-lock-apply-$PRIOR_CANDIDATE_SHA-$PRIOR_RUN_ID"
          response="$RUNNER_TEMP/pintpath-production-postgres-source-lock-prior-terminal-artifact.json"
          umask 077
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID/artifacts?name=$artifact_name&per_page=100"
          jq -e \
            --arg candidate "$PRIOR_CANDIDATE_SHA" \
            --arg name "$artifact_name" \
            --argjson priorRunId "$PRIOR_RUN_ID" \
            '.total_count == 1 and (.artifacts | length) == 1 and .artifacts[0].id == 9956147717 and .artifacts[0].name == $name and .artifacts[0].expired == false and .artifacts[0].size_in_bytes == 5869 and .artifacts[0].digest == "sha256:56829b4867083450e79eca099c75e1535453256cc4341611674f5228e34ec785" and .artifacts[0].workflow_run.id == $priorRunId and .artifacts[0].workflow_run.head_branch == "main" and .artifacts[0].workflow_run.head_sha == $candidate' \
            "$response" >/dev/null
          evidence="$RUNNER_TEMP/pintpath-production-postgres-source-lock-prior-terminal/pintpath-production-postgres-source-lock-evidence"
          terminal="$evidence/apply-terminal.json"
          receipt="$evidence/apply-receipt.json"
          test -f "$terminal"
          test ! -L "$terminal"
          test -f "$receipt"
          test ! -L "$receipt"
          terminal_sha256="$(sha256sum "$terminal" | awk '{print $1}')"
          receipt_sha256="$(sha256sum "$receipt" | awk '{print $1}')"
          test "$terminal_sha256" = 608420a0186048d2f60b376774444f116d411029a359734e8d0b5fcdf296f431
          test "$receipt_sha256" = 571c8b3269d557392c2fac317e330d9d28a38a95838265a926922f284b651b36
          jq -e \
            --arg candidate "$PRIOR_CANDIDATE_SHA" \
            --arg intentSha "61381d0ea3fd5394bb4de33b63379fcd13f524614797a434ff2b3e13f862bf9c" \
            '.schemaVersion == "pintpath-production-postgres-source-lock-terminal/v2" and .phase == "apply" and .receipt.candidateSha == $candidate and .receipt.outcome == "mutation_uncertain" and .receipt.intentSha256 == $intentSha and .receipt.patchId == null and .receipt.attempts == {dismiss:1,stage:0,commit:0} and .receipt.totalMutationCalls == 1 and .receipt.retryAllowed == false and .receipt.deploymentAllowed == false and .receipt.terminalSha256 == null and .receipt.secretMaterialIncluded == false and .receipt.providerCredentialsIncluded == false and .receipt.rawProviderMetadataIncluded == false' \
            "$terminal" >/dev/null
          jq -e \
            --arg candidate "$PRIOR_CANDIDATE_SHA" \
            --arg intentSha "61381d0ea3fd5394bb4de33b63379fcd13f524614797a434ff2b3e13f862bf9c" \
            '.schemaVersion == "pintpath-protected-production-postgres-source-lock/v2" and .phase == "apply" and .candidateSha == $candidate and .outcome == "mutation_uncertain" and .intentSha256 == $intentSha and .patchId == null and .attempts == {dismiss:1,stage:0,commit:0} and .totalMutationCalls == 1 and .retryAllowed == false and .deploymentAllowed == false and .terminalSha256 == "608420a0186048d2f60b376774444f116d411029a359734e8d0b5fcdf296f431" and .secretMaterialIncluded == false and .providerCredentialsIncluded == false and .rawProviderMetadataIncluded == false' \
            "$receipt" >/dev/null
          {
            printf 'artifact_id=%s\n' 9956147717
            printf 'artifact_digest=%s\n' sha256:56829b4867083450e79eca099c75e1535453256cc4341611674f5228e34ec785
            printf 'artifact_size=%s\n' 5869
            printf 'apply_terminal_sha256=%s\n' "$terminal_sha256"
            printf 'apply_receipt_sha256=%s\n' "$receipt_sha256"
            printf 'evidence_exact=true\n'
          } >> "$GITHUB_OUTPUT"

      - name: Reassert exact current main immediately before the protected writer
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Apply or reconcile the exact production Postgres source lock
        env:
          OPERATION_MODE: ${{ inputs.operation_mode }}
          PINTPATH_EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_INTENT_ARTIFACT_DIGEST: ${{ steps.intent_binding.outputs.artifact_digest }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_INTENT_ARTIFACT_ID: ${{ steps.intent_binding.outputs.artifact_id }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_INTENT_ARTIFACT_NAME: ${{ steps.intent_binding.outputs.artifact_name }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_INTENT_ARTIFACT_RUN_ID: ${{ steps.intent_binding.outputs.artifact_run_id }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_INTENT_SHA256: ${{ steps.intent_binding.outputs.intent_sha256 }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_RUN_GRACE: ${{ inputs.prior_run_grace_attestation }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_CANDIDATE_SHA: ${{ inputs.prior_candidate_sha }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_TERMINAL_ARTIFACT_ID: ${{ steps.prior_terminal_binding.outputs.artifact_id }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_TERMINAL_ARTIFACT_DIGEST: ${{ steps.prior_terminal_binding.outputs.artifact_digest }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_TERMINAL_ARTIFACT_SIZE: ${{ steps.prior_terminal_binding.outputs.artifact_size }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_APPLY_TERMINAL_SHA256: ${{ steps.prior_terminal_binding.outputs.apply_terminal_sha256 }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_APPLY_RECEIPT_SHA256: ${{ steps.prior_terminal_binding.outputs.apply_receipt_sha256 }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_LOCK_PRIOR_TERMINAL_EVIDENCE_EXACT: ${{ steps.prior_terminal_binding.outputs.evidence_exact }}
          PINTPATH_PRODUCTION_POSTGRES_SOURCE_REPIN_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_PRODUCTION_SOURCE_MUTATION_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_SOURCE_MUTATION_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          command=(
            npm run --silent railway:production:postgres-source-repin:protected --
            --phase "$OPERATION_MODE"
            --candidate-sha '${{ inputs.candidate_sha }}'
            --github-authority "$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence/reviewed-authority.json"
            --evidence-dir "$RUNNER_TEMP/pintpath-production-postgres-source-lock-evidence"
            --intent-file '${{ steps.intent_binding.outputs.intent_file }}'
          )
          if [[ "$OPERATION_MODE" = reconcile ]]; then
            command+=(--prior-candidate-sha '${{ inputs.prior_candidate_sha }}')
          fi
          "${command[@]}"

      - name: Reconcile the canonical Railway mutation boundary after every authorized attempt
        if: always() && steps.reviewed_authority.outcome == 'success'
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
        run: npm run readiness:railway:mutation-boundary

      - name: Upload secret-free terminal source-lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-postgres-source-lock-${{ inputs.operation_mode }}-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pintpath-production-postgres-source-lock-evidence/
            ${{ runner.temp }}/pintpath-production-postgres-source-lock-intent/source-lock-intent.json
          if-no-files-found: error
          retention-days: 30
