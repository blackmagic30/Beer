name: Apply and prove permanent-staging venue directory
run-name: Permanent staging venue directory | apply-refresh-validate | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      fenced_deployment_run_id:
        description: Exact successful same-candidate permanent-staging fenced deployment run
        required: true
        type: string
      confirmation:
        description: APPLY_REFRESH_VALIDATE_PERMANENT_STAGING_VENUE_DIRECTORY_<project-ref>_FOR_<candidate-sha>_AFTER_FENCED_RUN_<run-id>
        required: true
        type: string
      external_mutation_freeze_attestation:
        description: Freeze Dashboard, manual, and other CI venue-row and schema/migration writers for the full plan-to-proof-to-apply window, then type the exact attestation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pintpath-permanent-staging-key-rollout
  queue: max
  cancel-in-progress: false

jobs:
  apply-and-prove:
    name: Apply and prove permanent-staging venue directory
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: permanent-staging-venue-directory

    steps:
      - name: Checkout the exact main candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require an original current-main dispatch and exact attestations
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FENCED_DEPLOYMENT_RUN_ID: ${{ inputs.fenced_deployment_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$FENCED_DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          expected="APPLY_REFRESH_VALIDATE_PERMANENT_STAGING_VENUE_DIRECTORY_bbfibbadwjxzrcdncavy_FOR_${CANDIDATE_SHA}_AFTER_FENCED_RUN_${FENCED_DEPLOYMENT_RUN_ID}"
          test "$CONFIRMATION" = "$expected"
          test "$EXTERNAL_MUTATION_FREEZE_ATTESTATION" = \
            'I_ATTEST_EXTERNAL_PERMANENT_STAGING_VENUE_ROW_AND_SCHEMA_MIGRATION_WRITERS_ARE_FROZEN_FOR_THIS_RUN'

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Install the exact reviewed Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Verify the complete repository before protected secret custody
        run: npm run check

      - name: Create private evidence custody
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FENCED_DEPLOYMENT_RUN_ID: ${{ inputs.fenced_deployment_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pintpath-permanent-staging-venue-directory"
          mkdir -m 700 "$evidence"
          jq -cS -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg fencedDeploymentRunId "$FENCED_DEPLOYMENT_RUN_ID" \
            '{candidateSha:$candidateSha,fencedDeploymentRunId:$fencedDeploymentRunId,operation:"directory-discovery-and-status-refresh",schemaVersion:"pintpath-permanent-staging-venue-directory-dispatch/v1",secretDerivedCommitmentsIncluded:false,secretMaterialIncluded:false,supabaseProjectRef:"bbfibbadwjxzrcdncavy"}' \
            > "$evidence/dispatch.json"
          chmod 600 "$evidence/dispatch.json"

      - name: Download the exact fenced deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.fenced_deployment_run_id }}
          name: pintpath-permanent-staging-fenced-deployment-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-permanent-staging-venue-fenced-input

      - name: Authenticate the exact latest fenced deployment authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/pintpath-permanent-staging-venue-fenced-input/pintpath-staging-deployment-evidence/deployment-receipt.json"
          test -f "$receipt"
          test ! -L "$receipt"
          node --frozen-intrinsics --disable-proto=throw --import tsx \
            scripts/execute-protected-permanent-staging-venue-directory.ts \
            --mode verify-fenced-authority \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --fenced-deployment-run-id "${{ inputs.fenced_deployment_run_id }}" \
            --fenced-deployment-receipt "$receipt" \
            --output "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory/fenced-authority.json"

      - name: Preflight the database and seal the read-only venue plan
        env:
          SUPABASE_URL: https://bbfibbadwjxzrcdncavy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PINTPATH_STAGING_SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.PINTPATH_STAGING_GOOGLE_PLACES_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PINTPATH_SUPABASE_STAGING_DATABASE_MIGRATION_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PINTPATH_SUPABASE_STAGING_DATABASE_PASSWORD }}
          PINTPATH_VENUE_DIRECTORY_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = '2.109.1'
          migration='supabase/migrations/20260901032339_validate_external_venue_directory_constraints.sql'
          preflight='scripts/ci/supabase-venue-directory-preflight-verify.sql'
          test -f "$migration" && test ! -L "$migration"
          test "$(wc -c < "$migration" | tr -d '[:space:]')" = '161'
          test "$(sha256sum "$migration" | cut -d ' ' -f 1)" = \
            '5068c2a678813e57fde83b29d3cb5e438ce9070705f246827b7ee8e2a70ee96c'
          test -f "$preflight" && test ! -L "$preflight"
          test "$(wc -c < "$preflight" | tr -d '[:space:]')" = '6189'
          test "$(sha256sum "$preflight" | cut -d ' ' -f 1)" = \
            '9ae8804c03f7f515beaa80b6fb99ae886f200712482c21ae5eae11f9709b8c6a'
          node --frozen-intrinsics --disable-proto=throw --import tsx \
            scripts/execute-protected-permanent-staging-venue-directory.ts \
            --mode plan-refresh-validate \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --fenced-deployment-run-id "${{ inputs.fenced_deployment_run_id }}" \
            --fenced-authority-file "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory/fenced-authority.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory"

      - name: Reassert exact current main immediately before the venue mutation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Apply the exact venue plan and validate constraints
        env:
          SUPABASE_URL: https://bbfibbadwjxzrcdncavy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PINTPATH_STAGING_SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PINTPATH_SUPABASE_STAGING_DATABASE_MIGRATION_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PINTPATH_SUPABASE_STAGING_DATABASE_PASSWORD }}
          PINTPATH_VENUE_DIRECTORY_CONFIRMATION: ${{ inputs.confirmation }}
          PINTPATH_EXTERNAL_MUTATION_FREEZE_ATTESTATION: ${{ inputs.external_mutation_freeze_attestation }}
        shell: bash
        run: |
          set -euo pipefail
          node --frozen-intrinsics --disable-proto=throw --import tsx \
            scripts/execute-protected-permanent-staging-venue-directory.ts \
            --mode apply-refresh-validate \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --fenced-deployment-run-id "${{ inputs.fenced_deployment_run_id }}" \
            --fenced-authority-file "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory/fenced-authority.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory"

      - name: Postflight the exact permanent-staging constraint contract
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PINTPATH_SUPABASE_STAGING_DATABASE_MIGRATION_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PINTPATH_SUPABASE_STAGING_DATABASE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = '2.109.1'
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref bbfibbadwjxzrcdncavy \
            --password "$SUPABASE_DB_PASSWORD" --yes
          test "$(tr -d '\r\n' < supabase/.temp/project-ref)" = bbfibbadwjxzrcdncavy
          supabase db query --linked --agent no --output json \
            --file scripts/ci/supabase-venue-directory-schema-verify.sql
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run --yes

      - name: Materialize the canonical venue-directory terminal boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --frozen-intrinsics --disable-proto=throw --import tsx \
            scripts/execute-protected-permanent-staging-venue-directory.ts \
            --mode finalize-database-proof \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --fenced-deployment-run-id "${{ inputs.fenced_deployment_run_id }}" \
            --fenced-authority-file "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory/fenced-authority.json" \
            --evidence-dir "$RUNNER_TEMP/pintpath-permanent-staging-venue-directory"

      - name: Remove linked-project and downloaded fenced input custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            "$GITHUB_WORKSPACE/supabase/.temp" \
            "$RUNNER_TEMP/pintpath-permanent-staging-venue-fenced-input"; do
            if test -d "$root" && test ! -L "$root"; then
              find "$root" -depth -mindepth 1 -delete
              rmdir "$root"
            fi
          done

      - name: Upload exact secret-free venue-directory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-permanent-staging-venue-directory-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-permanent-staging-venue-directory/
          if-no-files-found: error
          retention-days: 90
