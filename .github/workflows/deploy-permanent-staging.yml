name: Deploy Pint Path permanent staging
run-name: Deploy permanent staging | ${{ inputs.phase }} | ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      phase:
        description: Upload the candidate while fenced at zero, or close out the active candidate at one
        required: true
        type: choice
        options:
          - fenced
          - active
      bootstrap_path:
        description: Proven staging predecessor chain
        required: true
        type: choice
        default: healthy-legacy
        options:
          - healthy-legacy
          - cold-dead
      prepare_run_id:
        description: Fenced only; successful same-candidate permanent-staging prepare run
        required: false
        type: string
      quiesce_run_id:
        description: Fenced only; successful same-candidate zero-replica quiescence run
        required: false
        type: string
      activation_run_id:
        description: Active only; successful same-candidate permanent-staging activation run
        required: false
        type: string
      confirmation:
        description: Exact phase and candidate confirmation from the runbook
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-permanent-staging-key-rollout
  queue: max
  cancel-in-progress: false

jobs:
  deploy-permanent-staging:
    name: Deploy permanent staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: permanent-staging-deployment
    env:
      PUBLIC_BASE_URL: https://beer-staging.up.railway.app

    steps:
      - name: Checkout the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require the exact current main candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          PHASE: ${{ inputs.phase }}
          BOOTSTRAP_PATH: ${{ inputs.bootstrap_path }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          QUIESCE_RUN_ID: ${{ inputs.quiesce_run_id }}
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$RUN_ATTEMPT" = "1"
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          case "$BOOTSTRAP_PATH" in healthy-legacy|cold-dead) ;; *) exit 1 ;; esac
          case "$PHASE" in
            fenced)
              [[ "$PREPARE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              [[ "$QUIESCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              test "$PREPARE_RUN_ID" != "$QUIESCE_RUN_ID"
              test "$PREPARE_RUN_ID" != "$RUN_ID"
              test "$QUIESCE_RUN_ID" != "$RUN_ID"
              test -z "$ACTIVATION_RUN_ID"
              test "$CONFIRMATION" = \
                "DEPLOY_PERMANENT_STAGING_FENCED_AT_ZERO_FOR_${CANDIDATE_SHA}"
              ;;
            active)
              test -z "$PREPARE_RUN_ID"
              test -z "$QUIESCE_RUN_ID"
              [[ "$ACTIVATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              test "$ACTIVATION_RUN_ID" != "$RUN_ID"
              test "$CONFIRMATION" = \
                "DEPLOY_PERMANENT_STAGING_ACTIVE_AT_ONE_FOR_${CANDIDATE_SHA}"
              ;;
            *) exit 1 ;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Require the policy-pinned permanent-staging public origin
        env:
          PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLIC_BASE_URL" = 'https://beer-staging.up.railway.app'
          if test "$PHASE" = fenced; then
            policy=./ops/railway/permanent-staging-fenced-app-deployment-policy.json
          else
            policy=./ops/railway/permanent-staging-app-deployment-policy.json
          fi
          policy_origin="$(node --eval \
            'process.stdout.write(require(process.argv[1]).target.publicOrigin)' "$policy")"
          test "$policy_origin" = "$PUBLIC_BASE_URL"

      - name: Install immutable dependencies
        run: npm ci

      - name: Run the complete repository gate
        run: npm run check

      - name: Create the private deployment evidence directory
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 \
            "$RUNNER_TEMP/pintpath-staging-deployment-evidence" \
            "$RUNNER_TEMP/pintpath-staging-deployment-prerequisites" \
            "$RUNNER_TEMP/pintpath-staging-deployment-prerequisites/prepare" \
            "$RUNNER_TEMP/pintpath-staging-deployment-prerequisites/quiesce" \
            "$RUNNER_TEMP/pintpath-staging-deployment-prerequisites/activate" \
            "$RUNNER_TEMP/pintpath-staging-deployment-prerequisites/sealed"

      - name: Require current main checks and artifacts
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/github-candidate-evidence"
          npm run --silent github:release-candidate:verify -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --phase staging \
            --output "$RUNNER_TEMP/github-candidate-evidence/required-checks.json"

      - name: Retrieve the exact staging worker prepare artifact
        if: inputs.phase == 'fenced' && inputs.bootstrap_path == 'healthy-legacy'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}
          name: pintpath-automatic-maintenance-worker-fence-permanent-staging-prepare-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-staging-deployment-prerequisites/prepare

      - name: Retrieve the exact staging quiescence artifact
        if: inputs.phase == 'fenced' && inputs.bootstrap_path == 'healthy-legacy'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.quiesce_run_id }}
          name: pintpath-permanent-staging-worker-bootstrap-quiesce-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-staging-deployment-prerequisites/quiesce

      - name: Retrieve the exact cold staging prepare artifact
        if: inputs.phase == 'fenced' && inputs.bootstrap_path == 'cold-dead'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}
          name: pintpath-permanent-staging-cold-prepare-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-staging-deployment-prerequisites/prepare

      - name: Retrieve the exact cold staging quiescence artifact
        if: inputs.phase == 'fenced' && inputs.bootstrap_path == 'cold-dead'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.quiesce_run_id }}
          name: pintpath-permanent-staging-cold-quiesce-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-staging-deployment-prerequisites/quiesce

      - name: Retrieve the exact staging worker activation artifact
        if: inputs.phase == 'active'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.activation_run_id }}
          name: pintpath-automatic-maintenance-worker-fence-permanent-staging-activate-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-staging-deployment-prerequisites/activate

      - name: Seal unique staging deployment prerequisite receipts
        env:
          PHASE: ${{ inputs.phase }}
          BOOTSTRAP_PATH: ${{ inputs.bootstrap_path }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pintpath-staging-deployment-prerequisites"
          seal_one() {
            local source_root="$1"
            local leaf="$2"
            local destination="$3"
            mapfile -d '' matches < <(find "$source_root" -type f -name "$leaf" -print0)
            test "${#matches[@]}" = 1
            test ! -L "${matches[0]}"
            test ! -e "$destination"
            cp --no-dereference -- "${matches[0]}" "$destination"
            chmod 600 "$destination"
          }
          if test "$PHASE" = fenced; then
            install -d -m 700 "$root/sealed/prepare" "$root/sealed/quiesce"
            if test "$BOOTSTRAP_PATH" = cold-dead; then
              seal_one "$root/prepare" cold-prepare-terminal.json \
                "$root/sealed/prepare/cold-prepare-terminal.json"
              seal_one "$root/quiesce" cold-quiesce-receipt.json \
                "$root/sealed/quiesce/cold-quiesce-receipt.json"
            else
              test "$BOOTSTRAP_PATH" = healthy-legacy
              seal_one "$root/prepare" automatic-maintenance-worker-fence-terminal.json \
                "$root/sealed/prepare/automatic-maintenance-worker-fence-terminal.json"
              seal_one "$root/quiesce" quiesce-staging-zero-receipt.json \
                "$root/sealed/quiesce/quiesce-staging-zero-receipt.json"
            fi
            seal_one "$root/quiesce" prerequisites-verification.json \
              "$root/sealed/quiesce/prerequisites-verification.json"
          else
            install -d -m 700 "$root/sealed/activate"
            seal_one "$root/activate" automatic-maintenance-worker-fence-terminal.json \
              "$root/sealed/activate/automatic-maintenance-worker-fence-terminal.json"
            seal_one "$root/activate" prerequisites-verification.json \
              "$root/sealed/activate/prerequisites-verification.json"
          fi

      - name: Verify exact staging deployment prerequisite provenance and chronology
        env:
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
          BOOTSTRAP_PATH: ${{ inputs.bootstrap_path }}
          PINTPATH_STAGING_WORKER_BOOTSTRAP_GITHUB_ENVIRONMENT: permanent-staging-deployment
          PINTPATH_STAGING_WORKER_BOOTSTRAP_OPERATION: ${{ inputs.phase == 'fenced' && 'fenced-deploy' || 'active-deploy' }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          QUIESCE_RUN_ID: ${{ inputs.quiesce_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pintpath-staging-deployment-prerequisites/sealed"
          output="$RUNNER_TEMP/pintpath-staging-deployment-evidence/prerequisites-verification.json"
          if test "$PHASE" = fenced; then
            args=(--operation fenced-deploy --bootstrap-path "$BOOTSTRAP_PATH" --candidate-sha "$CANDIDATE_SHA")
            if test "$BOOTSTRAP_PATH" = cold-dead; then
              args+=(
                --cold-prepare-run-id "$PREPARE_RUN_ID"
                --cold-prepare-terminal-file "$root/prepare/cold-prepare-terminal.json"
                --cold-quiesce-run-id "$QUIESCE_RUN_ID"
                --cold-quiesce-receipt-file "$root/quiesce/cold-quiesce-receipt.json"
                --cold-quiesce-verification-file "$root/quiesce/prerequisites-verification.json"
              )
            else
              test "$BOOTSTRAP_PATH" = healthy-legacy
              args+=(
                --prepare-run-id "$PREPARE_RUN_ID"
                --prepare-terminal-file "$root/prepare/automatic-maintenance-worker-fence-terminal.json"
                --quiesce-run-id "$QUIESCE_RUN_ID"
                --quiesce-receipt-file "$root/quiesce/quiesce-staging-zero-receipt.json"
                --quiesce-verification-file "$root/quiesce/prerequisites-verification.json"
              )
            fi
            args+=(--output "$output")
          else
            args=(
              --operation active-deploy
              --bootstrap-path "$BOOTSTRAP_PATH"
              --candidate-sha "$CANDIDATE_SHA"
              --activate-run-id "$ACTIVATION_RUN_ID"
              --activate-terminal-file "$root/activate/automatic-maintenance-worker-fence-terminal.json"
              --activate-verification-file "$root/activate/prerequisites-verification.json"
              --output "$output"
            )
          fi
          ./node_modules/.bin/tsx \
            scripts/verify-permanent-staging-worker-bootstrap-prerequisites.ts \
            "${args[@]}"

      - name: Remove downloaded staging deployment prerequisite custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          custody="$RUNNER_TEMP/pintpath-staging-deployment-prerequisites"
          if [[ -d "$custody" && ! -L "$custody" ]]; then
            find "$custody" -depth -mindepth 1 -delete
            rmdir "$custody"
          fi

      - name: Install the exact reviewed Railway CLI archive
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/pintpath-railway-cli"
          cli_archive="$cli_root/railway-5.32.0-x86_64-linux.tar.gz"
          mkdir -m 700 "$cli_root"
          curl --fail --silent --show-error --location \
            'https://github.com/railwayapp/cli/releases/download/v5.32.0/railway-v5.32.0-x86_64-unknown-linux-musl.tar.gz' \
            --output "$cli_archive"
          echo 'cd69b2ecb556601751165d85ac31a5fbc38cff46397939356df28d2b96a005f5  '"$cli_archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$cli_archive" --directory "$cli_root" \
            --no-same-owner --no-same-permissions
          cli_path="$cli_root/railway"
          test -f "$cli_path"
          echo '27133cfc20bffc43b2f32c1638fa3c50eefc2f9d2d80301a93de34632ccb7a43  '"$cli_path" \
            | sha256sum --check --strict
          chmod 500 "$cli_path"
          test "$("$cli_path" --version)" = 'railway 5.32.0'
          chmod 400 "$cli_archive"
          {
            echo "PINTPATH_RAILWAY_CLI_PATH=$cli_path"
            echo "PINTPATH_RAILWAY_CLI_ARCHIVE=$cli_archive"
          } >> "$GITHUB_ENV"

      - name: Reassert current main immediately before the provider write
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Execute one permanent-staging source upload and reconcile it
        env:
          PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PRODUCTION_METADATA_TOKEN }}
          PINTPATH_RAILWAY_STAGING_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_METADATA_TOKEN }}
          PINTPATH_RAILWAY_WRITE_TOKEN: ${{ secrets.PINTPATH_RAILWAY_STAGING_DEPLOY_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$PHASE" = fenced; then
            policy=ops/railway/permanent-staging-fenced-app-deployment-policy.json
          else
            policy=ops/railway/permanent-staging-app-deployment-policy.json
          fi
          ./node_modules/.bin/tsx scripts/execute-permanent-staging-app-deployment.ts \
            --policy "$policy" \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence-dir "$RUNNER_TEMP/pintpath-staging-deployment-evidence"

      - name: Bind the artifact to the tested commit
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CANDIDATE_SHA" \
            > "$RUNNER_TEMP/pintpath-staging-deployment-evidence/tested-commit-sha.txt"
          chmod 600 "$RUNNER_TEMP/pintpath-staging-deployment-evidence/tested-commit-sha.txt"

      - name: Upload immutable fenced permanent-staging deployment evidence
        if: always() && inputs.phase == 'fenced'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-permanent-staging-fenced-deployment-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/github-candidate-evidence/required-checks.json
            ${{ runner.temp }}/pintpath-staging-deployment-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable active permanent-staging deployment evidence
        if: always() && inputs.phase == 'active'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-permanent-staging-deployment-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/github-candidate-evidence/required-checks.json
            ${{ runner.temp }}/pintpath-staging-deployment-evidence/
          if-no-files-found: error
          retention-days: 30
