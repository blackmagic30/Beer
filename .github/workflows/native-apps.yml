name: Native Apps

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - ".github/workflows/native-apps.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - ".github/workflows/native-apps.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build, lint, and test Android debug app
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
