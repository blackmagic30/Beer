name: Native Apps

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Build, lint, and test Android debug and release apps
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug lintRelease testDebugUnitTest assembleDebug assembleRelease

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select and verify App Store Xcode toolchain
        shell: bash
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              xcode_app="$candidate"
            fi
          done
          if [ -z "$xcode_app" ]; then
            echo "A GitHub runner image with Xcode 26 is required." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$xcode_version" in
            26.*) ;;
            *) echo "Expected Xcode 26.x, found $xcode_version." >&2; exit 1 ;;
          esac
          case "$sdk_version" in
            26.*) ;;
            *) echo "Expected iPhoneOS SDK 26.x, found $sdk_version." >&2; exit 1 ;;
          esac
          echo "Using Xcode $xcode_version with iPhoneOS SDK $sdk_version."
      - name: Validate iOS production API response contracts
        run: |
          xcrun swiftc \
            apps/ios/BeerMap/Models/BeerMapModels.swift \
            apps/ios/ContractTests/IOSAPIContractCheck.swift \
            -o "$RUNNER_TEMP/ios-api-contract-check"
          "$RUNNER_TEMP/ios-api-contract-check"
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Validate unsigned iOS release archive
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BeerMap.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
