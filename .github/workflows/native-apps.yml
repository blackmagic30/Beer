name: Native Apps

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_android:
        description: Also run Android maintenance CI (Android is not in the current launch)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_android == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Build, lint, and test Android debug and release apps
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug lintRelease testDebugUnitTest assembleDebug assembleRelease

  ios:
    name: ${{ github.event_name == 'workflow_dispatch' && 'iOS dispatch prerequisite' || 'ios' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and verify App Store Xcode toolchain
        shell: bash
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              xcode_app="$candidate"
            fi
          done
          if [ -z "$xcode_app" ]; then
            echo "A GitHub runner image with Xcode 26 is required." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$xcode_version" in
            26.*) ;;
            *) echo "Expected Xcode 26.x, found $xcode_version." >&2; exit 1 ;;
          esac
          case "$sdk_version" in
            26.*) ;;
            *) echo "Expected iPhoneOS SDK 26.x, found $sdk_version." >&2; exit 1 ;;
          esac
          echo "Using Xcode $xcode_version with iPhoneOS SDK $sdk_version."
      - name: Validate iOS production API response contracts
        run: |
          xcrun swiftc \
            apps/ios/BeerMap/Models/BeerMapModels.swift \
            apps/ios/ContractTests/IOSAPIContractCheck.swift \
            -o "$RUNNER_TEMP/ios-api-contract-check"
          "$RUNNER_TEMP/ios-api-contract-check"
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Prepare synthetic public configuration for the unsigned iOS Release contract
        env:
          PINT_PATH_API_BASE_URL: https://pintpath.au
          SUPABASE_URL: https://auth.pintpath.au
          SUPABASE_ANON_KEY: sb_publishable_00000000000000000000000000000000
        run: apps/ios/Scripts/write-build-config.sh
      - name: Build unsigned iOS Release archive with synthetic public values
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BeerMap.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Inspect synthetic iOS Release archive configuration
        env:
          EXPECTED_PINT_PATH_API_BASE_URL: https://pintpath.au
          EXPECTED_SUPABASE_ANON_KEY: sb_publishable_00000000000000000000000000000000
        run: apps/ios/Scripts/inspect-release-archive.sh "$RUNNER_TEMP/BeerMap.xcarchive"
      - name: Remove generated iOS configuration
        if: always()
        run: rm -f apps/ios/Config.xcconfig

  ios-production-configuration:
    name: iOS protected production configuration archive
    if: github.event_name == 'workflow_dispatch'
    needs: ios
    environment: production
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and verify App Store Xcode toolchain
        shell: bash
        run: |
          xcode_app=""
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              xcode_app="$candidate"
            fi
          done
          if [ -z "$xcode_app" ]; then
            echo "A GitHub runner image with Xcode 26 is required." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$xcode_version" in
            26.*) ;;
            *) echo "Expected Xcode 26.x, found $xcode_version." >&2; exit 1 ;;
          esac
          case "$sdk_version" in
            26.*) ;;
            *) echo "Expected iPhoneOS SDK 26.x, found $sdk_version." >&2; exit 1 ;;
          esac
      - name: Generate ignored iOS configuration from protected production secrets
        env:
          PINT_PATH_API_BASE_URL: https://pintpath.au
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: apps/ios/Scripts/write-build-config.sh
      - name: Build unsigned iOS archive with protected production configuration
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BeerMap-production-config.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Inspect protected production values in the iOS archive
        env:
          EXPECTED_PINT_PATH_API_BASE_URL: https://pintpath.au
          EXPECTED_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          apps/ios/Scripts/inspect-release-archive.sh
          "$RUNNER_TEMP/BeerMap-production-config.xcarchive"
      - name: Remove generated iOS configuration
        if: always()
        run: rm -f apps/ios/Config.xcconfig
