name: Native Apps

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "src/modules/business/**"
      - "src/config/legal.ts"
      - "src/config/business-rules.ts"
      - "src/db/schema.sql"
      - "test/native-mobile-remediation.test.ts"
      - ".github/workflows/native-apps.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "src/modules/business/**"
      - "src/config/legal.ts"
      - "src/config/business-rules.ts"
      - "src/db/schema.sql"
      - "test/native-mobile-remediation.test.ts"
      - ".github/workflows/native-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Build, lint, and test Android debug and release apps
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug lintRelease testDebugUnitTest assembleDebug assembleRelease

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate iOS production API response contracts
        run: |
          xcrun swiftc \
            apps/ios/BeerMap/Models/BeerMapModels.swift \
            apps/ios/ContractTests/IOSAPIContractCheck.swift \
            -o "$RUNNER_TEMP/ios-api-contract-check"
          "$RUNNER_TEMP/ios-api-contract-check"
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Validate unsigned iOS release archive
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BeerMap.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
