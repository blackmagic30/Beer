name: Native Apps

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "src/modules/business/**"
      - "src/config/legal.ts"
      - "src/config/business-rules.ts"
      - "src/db/schema.sql"
      - "test/native-mobile-remediation.test.ts"
      - ".github/workflows/native-apps.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "src/modules/business/**"
      - "src/config/legal.ts"
      - "src/config/business-rules.ts"
      - "src/db/schema.sql"
      - "test/native-mobile-remediation.test.ts"
      - ".github/workflows/native-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Build, lint, and test Android debug and release apps
        working-directory: apps/android
        run: ./gradlew --no-daemon lintDebug lintRelease testDebugUnitTest assembleDebug assembleRelease

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Validate unsigned iOS release archive
        run: >-
          xcodebuild
          -project apps/ios/BeerMap.xcodeproj
          -scheme BeerMap
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BeerMap.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
