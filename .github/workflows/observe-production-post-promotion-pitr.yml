name: Observe Pint Path production post-promotion PITR

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current 40-character main SHA promoted while ingress is closed
        required: true
        type: string
      evidence_run_id:
        description: Run ID containing the deployment receipt and post-promotion logical manifest
        required: true
        type: string
      confirmation:
        description: Type OBSERVE_PRODUCTION_POST_PROMOTION_PITR
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: pintpath-production-rollout
  cancel-in-progress: false

jobs:
  observe-pitr:
    name: Observe exact production post-promotion PITR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-promotion-recovery
    steps:
      - name: Checkout the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require exact current main and protected authority
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$CONFIRMATION" = 'OBSERVE_PRODUCTION_POST_PROMOTION_PITR'
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$RUN_ATTEMPT" = '1'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"

      - name: Setup the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Create private evidence custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pintpath-production-pitr-input"
          mkdir -m 700 "$RUNNER_TEMP/pintpath-production-pitr-output"

      - name: Download exact candidate-bound observation inputs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          name: pintpath-production-post-promotion-pitr-input-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/pintpath-production-pitr-input

      - name: Require exact secret-free observation input inventory
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pintpath-production-pitr-input"
          test "$(find "$input" -mindepth 1 -type l -print -quit)" = ''
          mapfile -t observed < <(find "$input" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(logical-backup-manifest.json production-deployment-receipt.json)
          test "${#observed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${observed[$index]}" = "${expected[$index]}"
          done
          test "$(find "$input" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ''
          chmod 600 "$input"/*

      - name: Observe the exact provider PITR state without mutation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_ACTIONS: "true"
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PINTPATH_PRODUCTION_PROMOTION_RECOVERY_CONFIRMATION: ATTEST_PRODUCTION_PROMOTION_RECOVERY
          PINTPATH_POSTGRES_HA_PITR_AUTHORITY_TARGET: production
          PINTPATH_POSTGRES_HA_PITR_EXPECTED_ROOT_SERVICE_ID: ${{ vars.PINTPATH_POSTGRES_HA_PITR_EXPECTED_ROOT_SERVICE_ID }}
          PINTPATH_RAILWAY_PITR_METADATA_TOKEN: ${{ secrets.PINTPATH_RAILWAY_PITR_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          input="$RUNNER_TEMP/pintpath-production-pitr-input"
          output="$RUNNER_TEMP/pintpath-production-pitr-output"
          npm run --silent production:promotion-recovery:pitr:observe -- \
            --candidate-sha "$CANDIDATE_SHA" \
            --production-deployment-receipt "$input/production-deployment-receipt.json" \
            --logical-backup-manifest "$input/logical-backup-manifest.json" \
            --output "$output/pitr-receipt.json" \
            > "$output/observation-result.json"
          chmod 600 "$output/observation-result.json"

      - name: Upload the read-only PITR observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-production-post-promotion-pitr-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pintpath-production-pitr-output/pitr-receipt.json
            ${{ runner.temp }}/pintpath-production-pitr-output/observation-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove private input custody
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/pintpath-production-pitr-input"
          if [ -d "$input" ] && [ ! -L "$input" ]; then
            find "$input" -depth -mindepth 1 -delete
            rmdir "$input"
          fi
