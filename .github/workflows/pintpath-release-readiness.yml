name: Pint Path Automated Readiness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pintpath-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_PATH: ./data/ci-release-readiness.sqlite
      ALLOW_IN_MEMORY_RATE_LIMITING_IN_PRODUCTION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the authenticated reviewed PR head for release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npm run --silent github:release-reviewed-head:fetch --
          --evidence "$GITHUB_WORKSPACE/docs/release-evidence.json"

      - name: Build
        run: npm run build

      - name: Automated release-readiness tests
        run: npm run test:e2e:pintpath

      - name: Report external launch evidence status during ordinary CI
        run: |
          set -o pipefail
          npm run --silent release:evidence | tee release-evidence-summary.json

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit

      - name: Upload automated readiness evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-automated-readiness-evidence
          path: |
            docs/release-evidence.json
            release-evidence-summary.json
          if-no-files-found: error
