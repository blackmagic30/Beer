name: Pint Path Automated Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pintpath-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_PATH: ./data/ci-release-readiness.sqlite
      ALLOW_IN_MEMORY_RATE_LIMITING_IN_PRODUCTION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Automated release-readiness tests
        run: npm run test:e2e:pintpath

      - name: Report external launch evidence status during ordinary CI
        if: github.event_name != 'workflow_dispatch'
        run: npm run release:evidence | tee release-evidence-summary.json

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit

      - name: Enforce external launch evidence on manual release checks
        if: github.event_name == 'workflow_dispatch'
        run: npm run release:evidence:strict | tee release-evidence-summary.json

      - name: Upload launch evidence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pintpath-launch-evidence
          path: |
            docs/release-evidence.json
            release-evidence-summary.json
          if-no-files-found: warn
