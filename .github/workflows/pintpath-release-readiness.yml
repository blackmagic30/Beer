name: Pint Path Automated Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_PATH: ./data/ci-release-readiness.sqlite
      ALLOW_IN_MEMORY_RATE_LIMITING_IN_PRODUCTION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Automated release-readiness tests
        run: npm run test:e2e:pintpath

      - name: Report external launch evidence status (informational)
        run: npm run release:evidence | tee release-evidence-summary.json

      - name: Upload launch evidence report
        uses: actions/upload-artifact@v4
        with:
          name: pintpath-launch-evidence
          path: |
            docs/release-evidence.json
            release-evidence-summary.json

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit
