name: Pint Path Automated Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pintpath-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_PATH: ./data/ci-release-readiness.sqlite
      ALLOW_IN_MEMORY_RATE_LIMITING_IN_PRODUCTION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Automated release-readiness tests
        run: npm run test:e2e:pintpath

      - name: Report external launch evidence status during ordinary CI
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -o pipefail
          npm run --silent release:evidence | tee release-evidence-summary.json

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit

      - name: Enforce external launch evidence on manual release checks
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          npm run --silent release:evidence:strict | tee release-evidence-summary.json

      - name: Upload launch evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pintpath-launch-evidence
          path: |
            docs/release-evidence.json
            release-evidence-summary.json
          if-no-files-found: warn
