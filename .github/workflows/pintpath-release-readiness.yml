name: Pint Path Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_PATH: ./data/ci-release-readiness.sqlite
      DEMO_BILLING_MODE: "true"
      ALLOW_IN_MEMORY_RATE_LIMITING_IN_PRODUCTION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release-readiness tests
        run: npm run test:e2e:pintpath

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run security:audit
